<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>我的美食日記</title>

  <!-- PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#9C95DB" />

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Leaflet 地圖套件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }

    :root {
      --theme-color: #9C95DB;
      --theme-hover: #887FCB;
      --theme-light: #F2F0FB;
      --theme-text-light: #52479B;
    }

    .bg-theme { background-color: var(--theme-color) !important; }
    .bg-theme-hover:hover { background-color: var(--theme-hover) !important; }
    .bg-theme-light { background-color: var(--theme-light) !important; }
    .text-theme { color: var(--theme-color) !important; }
    .text-theme-dark { color: var(--theme-text-light) !important; }
    .border-theme { border-color: var(--theme-color) !important; }
    .accent-theme { accent-color: var(--theme-color) !important; }

    #mapView, #map {
      width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      position: absolute !important;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .custom-marker {
      background: var(--theme-color);
      width: 38px;
      height: 48px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      border: 2px solid #FFFFFF !important;
      transition: all 0.2s ease;
    }
    .custom-marker.low-score { background: #64748B !important; }
    .custom-marker-text {
      transform: rotate(45deg);
      color: white;
      font-weight: 800;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col h-screen overflow-hidden select-none">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-gray-150 px-4 py-2.5 flex items-center justify-between z-10 shadow-sm relative">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-full bg-theme-light flex items-center justify-center">
        <i class="fa-solid fa-book-bookmark text-theme text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-gray-900 leading-tight">我的美食日記</h1>
        <p class="text-[10px] text-gray-400">私人專屬 · 支援精確座標貼上</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button onclick="toggleBackupMenu()" title="資料備份" class="text-gray-400 hover:text-theme p-1.5 rounded-full active:scale-95 transition">
        <i class="fa-solid fa-box-archive text-base"></i>
      </button>
      <button onclick="openManualAddModal()" class="bg-theme bg-theme-hover text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center shadow-md active:scale-95 transition">
        <i class="fa-solid fa-plus mr-1"></i> 寫一篇
      </button>
    </div>
  </header>

  <!-- 備份選單 -->
  <div id="backupMenu" class="hidden absolute top-14 right-4 bg-white shadow-2xl rounded-2xl border border-gray-150 p-2.5 z-[1100] w-48 text-xs space-y-1">
    <button onclick="exportData()" class="w-full text-left py-2 px-2.5 hover:bg-theme-light rounded-xl flex items-center font-bold text-gray-700">
      <i class="fa-solid fa-download mr-2 text-theme"></i> 匯出日記備份檔
    </button>
    <label class="w-full text-left py-2 px-2.5 hover:bg-theme-light rounded-xl flex items-center font-bold text-gray-700 cursor-pointer">
      <i class="fa-solid fa-upload mr-2 text-blue-500"></i> 還原匯入備份
      <input type="file" id="importFileInput" accept=".json" onchange="importData(event)" class="hidden" />
    </label>
  </div>

  <!-- 主要畫面區域 -->
  <main class="flex-1 relative w-full h-full overflow-hidden">
    <!-- 地圖 View -->
    <div id="mapView" class="w-full h-full relative">
      <!-- 懸浮提示條 -->
      <div id="mapPickHint" class="hidden absolute top-3 left-4 right-4 z-[500] bg-theme text-white text-xs font-bold py-2.5 px-4 rounded-2xl shadow-xl flex items-center justify-between animate-bounce">
        <span>📍 請在地圖上滑動，點選店家的確切位置</span>
        <button onclick="cancelMapPick()" class="text-white underline text-[11px] ml-2">取消</button>
      </div>

      <!-- GPS 定位按鈕 -->
      <button onclick="locateUser()" title="定位我的位置" class="absolute bottom-6 right-4 z-[500] bg-white text-gray-700 hover:text-theme w-11 h-11 rounded-full shadow-xl flex items-center justify-center border border-gray-200 active:scale-90 transition">
        <i class="fa-solid fa-crosshairs text-lg"></i>
      </button>

      <div id="map"></div>
    </div>

    <!-- 列表 View -->
    <div id="listView" class="hidden w-full h-full bg-gray-50 overflow-y-auto px-4 py-3 pb-24 absolute inset-0 z-10">
      <div class="bg-white p-3.5 rounded-2xl shadow-sm mb-3 space-y-2.5 border border-gray-150">
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="font-bold text-gray-700">1. 選擇國家</label>
            <select id="filterCountry" onchange="onCountryChange()" class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-lg p-2 font-medium focus:border-theme outline-none">
            </select>
          </div>
          <div>
            <label class="font-bold text-gray-700">2. 選擇城市</label>
            <select id="filterCity" onchange="onCityChange()" disabled class="w-full mt-1 bg-gray-100 text-gray-400 border border-gray-200 rounded-lg p-2 font-medium outline-none transition cursor-not-allowed">
              <option value="">請先選擇國家</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="font-bold text-gray-500">🏷️ 標籤分類</label>
            <select id="filterTag" onchange="renderListView()" class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-lg p-2 font-medium">
            </select>
          </div>
          <div>
            <label class="font-bold text-gray-500">⭐ 評分篩選</label>
            <select id="filterRating" onchange="renderListView()" class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-lg p-2 font-medium">
              <option value="all">不限分數</option>
              <option value="gte_4.5">4.5 星以上</option>
              <option value="gte_4.0">4.0 星以上</option>
              <option value="gte_3.0">3.0 星以上</option>
              <option value="lt_3.0">⚠️ 未滿 3.0 星 (避雷區)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 餐廳清單 -->
      <div id="restaurantCards" class="space-y-3"></div>
    </div>
  </main>

  <!-- 底部 Tab 列 -->
  <nav class="bg-white border-t border-gray-200 px-8 py-2 flex justify-around items-center z-10 shadow-lg relative">
    <button onclick="switchTab('map')" id="tabMapBtn" class="flex flex-col items-center text-theme font-bold text-xs active:scale-95 transition">
      <i class="fa-solid fa-map-location-dot text-lg mb-0.5"></i>
      地圖模式
    </button>
    <button onclick="switchTab('list')" id="tabListBtn" class="flex flex-col items-center text-gray-400 font-bold text-xs active:scale-95 transition">
      <i class="fa-solid fa-book text-lg mb-0.5"></i>
      日記列表 (<span id="totalCount">0</span>)
    </button>
  </nav>

  <!-- 彈跳表單視窗 -->
  <div id="entryModal" class="hidden fixed inset-0 bg-black/60 z-[1000] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md max-h-[92vh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-gray-150 flex justify-between items-center bg-gray-50">
        <div>
          <h3 class="font-bold text-gray-800 text-sm" id="modalMainTitle">記錄美食日記</h3>
          <p class="text-[10px] text-gray-400" id="modalSubTitle">精準定位方式</p>
        </div>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>

      <div class="p-5 overflow-y-auto space-y-3.5 text-xs">
        <div class="bg-theme-light p-3 rounded-2xl border border-purple-100 space-y-2">
          <input type="text" id="inputStoreName" placeholder="店家名稱 (必填) *" class="w-full bg-transparent font-bold text-gray-900 text-sm outline-none border-b border-purple-200 pb-1" />
          
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="inputCountry" placeholder="國家 (例: 台灣)" class="bg-white border border-purple-100 rounded-lg p-1.5 text-xs outline-none" />
            <input type="text" id="inputCity" placeholder="城市 (例: 新竹市)" class="bg-white border border-purple-100 rounded-lg p-1.5 text-xs outline-none" />
          </div>
          
          <input type="text" id="inputStoreAddress" placeholder="地址 (選填)" class="w-full bg-white border border-purple-100 rounded-lg p-1.5 text-xs outline-none" />

          <!-- 【核心升級 1】：直接貼上 Google 座標 -->
          <div class="bg-white/80 p-2 rounded-xl border border-purple-200 space-y-1">
            <label class="block font-bold text-theme-dark text-[11px]">📍 方式一：貼上 Google Maps 座標（最精準）</label>
            <div class="flex items-center space-x-1.5">
              <input type="text" id="inputCoords" placeholder="例: 24.8085, 120.9712" oninput="handleCoordsInput(this.value)" class="flex-1 bg-gray-50 border border-gray-200 rounded-lg p-1 text-xs outline-none font-mono" />
              <button type="button" onclick="pasteFromClipboard()" class="bg-theme text-white px-2 py-1 rounded-lg font-bold text-[10px] whitespace-nowrap active:scale-95">
                貼上
              </button>
            </div>
            <p class="text-[9px] text-gray-400">💡 打開 Google Maps 長按店家 ➔ 複製上方座標數字 ➔ 貼到此處</p>
          </div>

          <!-- 【核心升級 2】：在地圖上滑動點選 -->
          <button type="button" onclick="startMapPickMode()" class="w-full bg-white hover:bg-theme hover:text-white text-theme-dark border border-purple-200 py-1.5 rounded-xl font-bold text-xs transition shadow-xs flex items-center justify-center space-x-1 active:scale-95">
            <i class="fa-solid fa-map-pin text-theme"></i>
            <span>方式二：在地圖上直接點選這家店</span>
          </button>
          
          <p id="geoStatusText" class="text-[10px] text-center font-bold text-gray-500"></p>
        </div>

        <div class="bg-gray-50 p-3 rounded-2xl border border-gray-200">
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-gray-700">評分 (0.5 級距)</span>
            <input type="number" id="inputRatingNumber" min="1.0" max="5.0" step="0.5" value="4.5" oninput="handleNumberInput(this.value)" class="w-16 text-center font-black text-theme bg-white border border-gray-300 rounded-lg py-1 text-sm outline-none" />
          </div>
          <div class="flex items-center justify-center space-x-2 py-1 bg-white rounded-xl border border-gray-150">
            <div id="starContainer" class="flex text-2xl text-amber-400 cursor-pointer select-none space-x-1"></div>
            <span id="starScoreLabel" class="text-sm font-black text-amber-600 ml-2">4.5 分</span>
          </div>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">用餐照片</label>
          <label id="uploadBox" class="border-2 border-dashed border-gray-300 hover:border-theme bg-gray-50 rounded-2xl p-3 flex flex-col items-center justify-center cursor-pointer transition">
            <span class="font-bold text-gray-700 text-xs">📸 上傳照片</span>
            <input type="file" id="inputPhoto" accept="image/*" onchange="handlePhotoSelect(event)" class="hidden" />
          </label>
          <div id="photoPreviewArea" class="hidden relative rounded-2xl overflow-hidden border border-gray-200">
            <img id="previewImg" class="w-full h-36 object-cover" />
            <button onclick="removeSelectedPhoto()" type="button" class="absolute top-2 right-2 bg-black/60 text-white w-7 h-7 rounded-full flex items-center justify-center text-xs">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-bold text-gray-700 mb-1">用餐日期</label>
            <input type="date" id="inputDate" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-2 py-1.5 text-xs" />
          </div>
          <div>
            <label class="block font-bold text-gray-700 mb-1">人均消費</label>
            <input type="number" id="inputCost" placeholder="例: 350" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-2 py-1.5 text-xs" />
          </div>
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">標籤 (逗號分隔)</label>
          <input type="text" id="inputTags" placeholder="小吃, 甜點, 拉麵" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-1.5 text-xs" />
        </div>

        <div>
          <label class="block font-bold text-gray-700 mb-1">用餐感受心得</label>
          <textarea id="inputReview" rows="3" placeholder="記錄必點料理或踩雷筆記..." class="w-full bg-gray-50 border border-gray-300 rounded-xl p-2 text-xs leading-relaxed"></textarea>
        </div>

        <div class="flex items-center space-x-2">
          <input type="checkbox" id="inputRevisit" checked class="w-4 h-4 rounded border-gray-300 accent-theme" />
          <label for="inputRevisit" class="font-bold text-gray-700 text-xs">推薦再訪 👍</label>
        </div>
      </div>

      <div class="p-3 border-t border-gray-150 bg-gray-50 flex items-center justify-between space-x-2">
        <button id="modalDeleteBtn" onclick="deleteCurrentEditingVisit()" class="hidden py-2 px-3 bg-red-50 text-red-600 font-bold rounded-xl text-xs">
          刪除
        </button>
        <button onclick="closeModal()" class="py-2 px-4 bg-gray-200 text-gray-700 font-bold rounded-xl text-xs">取消</button>
        <button onclick="confirmSaveRecord()" class="flex-1 py-2 bg-theme text-white font-bold rounded-xl text-xs shadow-md" id="submitBtnText">存入美食日記</button>
      </div>
    </div>
  </div>

  <!-- IndexedDB 本機資料庫 -->
  <script>
    let db;
    const DB_NAME = "FreeFoodDiaryDB_v7";
    const STORE_NAME = "restaurants";

    function initDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: "id" });
          };
          req.onsuccess = (e) => { db = e.target.result; resolve(); };
          req.onerror = () => resolve();
        } catch(e) { resolve(); }
      });
    }

    function dbGetAll() {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        const tx = db.transaction([STORE_NAME], "readonly");
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    function dbPut(item) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        const tx = db.transaction([STORE_NAME], "readwrite");
        tx.objectStore(STORE_NAME).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    function dbDelete(id) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        const tx = db.transaction([STORE_NAME], "readwrite");
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
      });
    }
  </script>

  <!-- 應用程式邏輯 -->
  <script>
    const TAIWAN_CITIES = {
      "新竹市": [24.8138, 120.9675],
      "新竹縣": [24.8383, 121.0177],
      "台北市": [25.0375, 121.5637],
      "新北市": [25.0169, 121.4628],
      "台中市": [24.1631, 120.6473],
      "高雄市": [22.6273, 120.3014],
      "台南市": [22.9997, 120.2270],
      "桃園市": [24.9936, 121.3010]
    };

    let appData = [];
    let map, markersLayer, tempPinMarker = null;
    let currentModalMode = 'CREATE';
    let editingStoreId = null, editingVisitId = null;
    let currentRatingValue = 4.5;
    let uploadedPhotoBase64 = "";
    let userLocationMarker = null;
    let pendingLocation = null;
    let isPickingOnMap = false;

    async function initApp() {
      initMap();
      await initDB();
      appData = await dbGetAll();

      if (appData.length === 0) {
        const sample = {
          id: "store_sample",
          name: "隱家拉麵 赤峰店",
          country: "台灣",
          city: "台北市",
          address: "台北市大同區南京西路25巷28號",
          lat: 25.0537,
          lng: 121.5208,
          tags: ["拉麵"],
          visits: [{
            visitId: "v_sample",
            date: new Date().toISOString().split("T")[0],
            rating: 5.0,
            cost: 280,
            revisit: true,
            review: "範例筆記：點擊旁邊編輯，可貼上 Google Maps 座標或在地上選點！",
            photo: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&auto=format&fit=crop"
          }]
        };
        await dbPut(sample);
        appData = [sample];
      }

      buildStarsUI();
      refreshViews();
      setTimeout(() => { if (map) map.invalidateSize(); }, 200);
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([24.8138, 120.9675], 12);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      markersLayer = L.layerGroup().addTo(map);

      // 地圖點擊事件
      map.on('click', (e) => {
        if (isPickingOnMap) {
          // 在地圖選點模式中
          setPickedLocation(e.latlng.lat, e.latlng.lng);
        }
      });
    }

    // ========== 選點與貼上座標核心 ==========

    // 啟動地圖選點模式
    function startMapPickMode() {
      isPickingOnMap = true;
      document.getElementById("entryModal").classList.add("hidden");
      document.getElementById("mapPickHint").classList.remove("hidden");
      switchTab('map');
    }

    function cancelMapPick() {
      isPickingOnMap = false;
      document.getElementById("mapPickHint").classList.add("hidden");
      document.getElementById("entryModal").classList.remove("hidden");
    }

    function setPickedLocation(lat, lng) {
      isPickingOnMap = false;
      pendingLocation = { lat, lng };
      document.getElementById("mapPickHint").classList.add("hidden");

      if (tempPinMarker) map.removeLayer(tempPinMarker);
      tempPinMarker = L.circleMarker([lat, lng], {
        radius: 9, fillColor: "#10B981", color: "#FFFFFF", weight: 3, opacity: 1, fillOpacity: 0.95
      }).addTo(map);

      document.getElementById("inputCoords").value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      document.getElementById("geoStatusText").innerText = `✅ 已在地圖上選定位置 (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
      document.getElementById("geoStatusText").className = "text-[10px] text-center font-bold text-green-600";

      document.getElementById("entryModal").classList.remove("hidden");
    }

    // 處理手動輸入或貼上 Google 座標 (支援 24.8085, 120.9712 格式)
    function handleCoordsInput(val) {
      const match = val.match(/([0-9]+\.[0-9]+)[,\s]+([0-9]+\.[0-9]+)/);
      if (match) {
        const lat = parseFloat(match[1]);
        const lng = parseFloat(match[2]);
        pendingLocation = { lat, lng };
        document.getElementById("geoStatusText").innerText = `✅ 已解析 Google 座標 (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
        document.getElementById("geoStatusText").className = "text-[10px] text-center font-bold text-green-600";

        map.flyTo([lat, lng], 16);
        if (tempPinMarker) map.removeLayer(tempPinMarker);
        tempPinMarker = L.circleMarker([lat, lng], {
          radius: 9, fillColor: "#10B981", color: "#FFFFFF", weight: 3, opacity: 1, fillOpacity: 0.95
        }).addTo(map);
      }
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("inputCoords").value = text;
        handleCoordsInput(text);
      } catch(e) {
        alert("請長按輸入框手動貼上座標！");
      }
    }

    // ========== 儲存邏輯 ==========
    async function confirmSaveRecord() {
      const name = document.getElementById("inputStoreName").value.trim();
      const country = document.getElementById("inputCountry").value.trim() || "台灣";
      const city = document.getElementById("inputCity").value.trim() || "新竹市";
      const address = document.getElementById("inputStoreAddress").value.trim();
      const date = document.getElementById("inputDate").value;
      const cost = document.getElementById("inputCost").value;
      const review = document.getElementById("inputReview").value;
      const revisit = document.getElementById("inputRevisit").checked;
      const tags = document.getElementById("inputTags").value.split(/[,，\s]+/).filter(Boolean);

      if (!name) return alert("請輸入店家名稱！");

      // 決定最終坐標
      let finalCoords = pendingLocation;

      // 如果使用者沒貼座標也沒選點，依城市自動對齊（新竹就在新竹中心）
      if (!finalCoords) {
        for (const c in TAIWAN_CITIES) {
          if (city.includes(c) || address.includes(c)) {
            finalCoords = { lat: TAIWAN_CITIES[c][0], lng: TAIWAN_CITIES[c][1] };
            break;
          }
        }
      }

      if (!finalCoords) {
        finalCoords = { lat: 24.8138, lng: 120.9675 }; // 預設新竹
      }

      if (currentModalMode === 'EDIT') {
        const store = appData.find(s => s.id === editingStoreId);
        if (store) {
          store.name = name;
          store.country = country;
          store.city = city;
          store.address = address;
          store.lat = finalCoords.lat;
          store.lng = finalCoords.lng;
          store.tags = tags;
          const visit = store.visits.find(v => v.visitId === editingVisitId);
          if (visit) {
            visit.date = date;
            visit.rating = currentRatingValue;
            visit.cost = cost ? Number(cost) : null;
            visit.review = review;
            visit.revisit = revisit;
            if (uploadedPhotoBase64) visit.photo = uploadedPhotoBase64;
          }
          await dbPut(store);
        }
      } else if (currentModalMode === 'REVISIT') {
        const store = appData.find(s => s.id === editingStoreId);
        if (store) {
          store.visits.unshift({
            visitId: "v_" + Date.now(),
            date: date,
            rating: currentRatingValue,
            cost: cost ? Number(cost) : null,
            revisit: revisit,
            review: review,
            photo: uploadedPhotoBase64
          });
          store.tags = Array.from(new Set([...store.tags, ...tags]));
          await dbPut(store);
        }
      } else {
        const newStore = {
          id: "store_" + Date.now(),
          name: name,
          country: country,
          city: city,
          address: address,
          lat: finalCoords.lat,
          lng: finalCoords.lng,
          tags: tags.length ? tags : ["美食"],
          visits: [{
            visitId: "v_" + Date.now(),
            date: date,
            rating: currentRatingValue,
            cost: cost ? Number(cost) : null,
            revisit: revisit,
            review: review,
            photo: uploadedPhotoBase64
          }]
        };
        await dbPut(newStore);
        appData.unshift(newStore);
      }

      closeModal();
      refreshViews();
      map.flyTo([finalCoords.lat, finalCoords.lng], 16);
    }

    // ========== 介面更新 ==========
    function refreshViews() {
      initCountryFilter();
      initTagFilter();
      renderMarkers();
      renderListView();
    }

    function initCountryFilter() {
      const countrySet = new Set(appData.map(i => i.country).filter(Boolean));
      document.getElementById("filterCountry").innerHTML = `<option value="">全部國家 (${countrySet.size})</option>` + 
        [...countrySet].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function onCountryChange() {
      const country = document.getElementById("filterCountry").value;
      const citySelect = document.getElementById("filterCity");
      if (!country) {
        citySelect.disabled = true;
        citySelect.innerHTML = `<option value="">請先選擇國家</option>`;
      } else {
        citySelect.disabled = false;
        const cities = new Set(appData.filter(i => i.country === country).map(i => i.city).filter(Boolean));
        citySelect.innerHTML = `<option value="">全部城市 (${cities.size})</option>` + 
          [...cities].map(c => `<option value="${c}">${c}</option>`).join('');
      }
      renderListView();
    }

    function onCityChange() { renderListView(); }

    function initTagFilter() {
      const tagSet = new Set();
      appData.forEach(item => (item.tags || []).forEach(t => tagSet.add(t)));
      document.getElementById("filterTag").innerHTML = `<option value="">全部標籤 (${tagSet.size})</option>` + 
        [...tagSet].map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function renderMarkers() {
      markersLayer.clearLayers();
      appData.forEach(item => {
        const latest = item.visits[0];
        if (!latest) return;
        const icon = L.divIcon({
          className: '',
          html: `<div class="custom-marker ${latest.rating < 3 ? 'low-score':''}"><span class="custom-marker-text">${latest.rating.toFixed(1)}</span></div>`,
          iconSize: [38, 48],
          iconAnchor: [19, 48],
          popupAnchor: [0, -42]
        });

        const revisitBadge = latest.revisit
          ? `<span style="color:#DC2626; font-weight:900; background:#FEE2E2; padding:2px 6px; border-radius:6px;">推薦再訪 👍</span>`
          : `<span style="color:#6B7280; font-weight:bold; background:#F3F4F6; padding:2px 6px; border-radius:6px;">不再訪 ❌</span>`;

        const content = `
          <div style="font-family: system-ui; width: 220px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
              <span style="font-size:10px; background:#F2F0FB; color:#52479B; padding:1px 6px; border-radius:4px; font-weight:bold;">${item.country} · ${item.city}</span>
              ${item.visits.length > 1 ? `<span style="font-size:10px; background:#FEF3C7; color:#D97706; padding:1px 6px; border-radius:4px; font-weight:bold;">已訪 ${item.visits.length} 次</span>` : ''}
            </div>
            ${latest.photo ? `<img src="${latest.photo}" style="width:100%; height:95px; object-fit:cover; border-radius:10px; margin-bottom:6px;" />` : ''}
            <h4 style="margin:0 0 2px; font-weight:bold; font-size:13px;">${item.name}</h4>
            <div style="font-size:11px; margin-bottom:4px;"><b style="color:#9C95DB; font-size:13px;">★ ${latest.rating.toFixed(1)}</b> ${revisitBadge}</div>
            <p style="font-size:11px; color:#555; margin:0 0 6px;">${latest.review || '無心得'}</p>
            <button onclick="openEditModal('${item.id}', '${latest.visitId}')" style="width:100%; background:#F3F4F6; color:#4B5563; border:1px solid #E5E7EB; border-radius:8px; padding:4px 0; font-size:11px; font-weight:bold; cursor:pointer;">✏️ 編輯或重新定位</button>
          </div>
        `;

        L.marker([item.lat, item.lng], { icon: icon, recordId: item.id }).bindPopup(content).addTo(markersLayer);
      });
    }

    function renderListView() {
      const countryFilter = document.getElementById("filterCountry").value;
      const cityFilter = document.getElementById("filterCity").value;
      const tagFilter = document.getElementById("filterTag").value;
      const ratingFilter = document.getElementById("filterRating").value;

      let list = [...appData];
      if (countryFilter) list = list.filter(i => i.country === countryFilter);
      if (cityFilter) list = list.filter(i => i.city === cityFilter);
      if (tagFilter) list = list.filter(i => (i.tags || []).includes(tagFilter));
      if (ratingFilter === "gte_4.5") list = list.filter(i => i.visits[0]?.rating >= 4.5);
      else if (ratingFilter === "lt_3.0") list = list.filter(i => i.visits[0]?.rating < 3.0);

      document.getElementById("totalCount").innerText = list.length;
      const container = document.getElementById("restaurantCards");

      if (!list.length) {
        container.innerHTML = `<div class="text-center text-gray-400 py-12 text-xs">查無美食日記</div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const latest = item.visits[0];
        return `
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-150 flex flex-col space-y-2.5">
            <div class="flex justify-between items-start">
              <div>
                <span class="bg-theme-light text-theme-dark text-[10px] px-2 py-0.5 rounded-full font-bold">${item.country} · ${item.city}</span>
                <h3 class="font-bold text-gray-900 text-sm mt-0.5">${item.name}</h3>
                <p class="text-[11px] text-gray-400">${item.address || '無詳細地址'}</p>
              </div>
              <button onclick="openEditModal('${item.id}', '${latest.visitId}')" class="text-theme-dark bg-purple-50 border border-purple-200 px-2 py-1 rounded-lg text-xs font-bold">
                ✏️ 編輯/換座標
              </button>
            </div>
            ${latest.photo ? `<img src="${latest.photo}" class="w-full h-36 object-cover rounded-xl" />` : ''}
            <div class="bg-gray-50 p-2.5 rounded-xl text-xs text-gray-600">
              <span class="font-bold text-amber-500 mr-1">★ ${latest.rating.toFixed(1)}</span>
              "${latest.review || '無心得'}"
            </div>
          </div>
        `;
      }).join('');
    }

    // ========== 彈窗輔助 ==========
    function openManualAddModal() {
      currentModalMode = 'CREATE';
      pendingLocation = null;
      document.getElementById("modalMainTitle").innerText = "記錄新店家";
      document.getElementById("inputStoreName").value = "";
      document.getElementById("inputCountry").value = "台灣";
      document.getElementById("inputCity").value = "新竹市";
      document.getElementById("inputStoreAddress").value = "";
      document.getElementById("inputCoords").value = "";
      document.getElementById("geoStatusText").innerText = "可貼上 Google 座標或點選地圖選點";
      document.getElementById("geoStatusText").className = "text-[10px] text-center font-bold text-gray-400";
      document.getElementById("inputDate").value = new Date().toISOString().split("T")[0];
      document.getElementById("entryModal").classList.remove("hidden");
    }

    function openEditModal(storeId, visitId) {
      const store = appData.find(s => s.id === storeId);
      if (!store) return;
      const visit = store.visits.find(v => v.visitId === visitId) || store.visits[0];

      currentModalMode = 'EDIT';
      editingStoreId = storeId;
      editingVisitId = visit.visitId;
      pendingLocation = { lat: store.lat, lng: store.lng };

      document.getElementById("modalMainTitle").innerText = `編輯與重新定位 ✏️`;
      document.getElementById("inputStoreName").value = store.name;
      document.getElementById("inputCountry").value = store.country || "台灣";
      document.getElementById("inputCity").value = store.city || "新竹市";
      document.getElementById("inputStoreAddress").value = store.address || "";
      document.getElementById("inputCoords").value = `${store.lat.toFixed(5)}, ${store.lng.toFixed(5)}`;
      document.getElementById("geoStatusText").innerText = `目前位置：${store.lat.toFixed(4)}, ${store.lng.toFixed(4)}`;
      document.getElementById("geoStatusText").className = "text-[10px] text-center font-bold text-theme-dark";
      document.getElementById("inputReview").value = visit.review || "";
      document.getElementById("inputCost").value = visit.cost || "";
      document.getElementById("inputDate").value = visit.date;
      document.getElementById("modalDeleteBtn").classList.remove("hidden");

      setRating(visit.rating);
      document.getElementById("entryModal").classList.remove("hidden");
    }

    function closeModal() { document.getElementById("entryModal").classList.add("hidden"); }

    function buildStarsUI() {
      const container = document.getElementById("starContainer");
      container.innerHTML = "";
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement("span");
        star.className = "inline-block cursor-pointer";
        star.onclick = (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          let val = (e.clientX - rect.left) < (rect.width / 2) ? i - 0.5 : i;
          setRating(val);
        };
        star.id = `star_${i}`;
        container.appendChild(star);
      }
      setRating(4.5);
    }

    function setRating(val) {
      currentRatingValue = val;
      document.getElementById("inputRatingNumber").value = val.toFixed(1);
      document.getElementById("starScoreLabel").innerText = `${val.toFixed(1)} 分`;
      for (let i = 1; i <= 5; i++) {
        const s = document.getElementById(`star_${i}`);
        if (!s) continue;
        if (val >= i) s.innerHTML = '<i class="fa-solid fa-star text-amber-400"></i>';
        else if (val >= i - 0.5) s.innerHTML = '<i class="fa-solid fa-star-half-stroke text-amber-400"></i>';
        else s.innerHTML = '<i class="fa-regular fa-star text-gray-300"></i>';
      }
    }

    function handleNumberInput(val) {
      let num = parseFloat(val) || 1.0;
      setRating(Math.round(num * 2) / 2);
    }

    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        uploadedPhotoBase64 = e.target.result;
        document.getElementById("previewImg").src = uploadedPhotoBase64;
        document.getElementById("uploadBox").classList.add("hidden");
        document.getElementById("photoPreviewArea").classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    }

    function removeSelectedPhoto() {
      uploadedPhotoBase64 = "";
      document.getElementById("uploadBox").classList.remove("hidden");
      document.getElementById("photoPreviewArea").classList.add("hidden");
    }

    function switchTab(tab) {
      if (tab === 'map') {
        document.getElementById("mapView").classList.remove("hidden");
        document.getElementById("listView").classList.add("hidden");
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        document.getElementById("mapView").classList.add("hidden");
        document.getElementById("listView").classList.remove("hidden");
        renderListView();
      }
    }

    function locateUser() {
      navigator.geolocation.getCurrentPosition((pos) => {
        map.flyTo([pos.coords.latitude, pos.coords.longitude], 15);
      });
    }

    window.onload = initApp;
  </script>
</body>
</html>
