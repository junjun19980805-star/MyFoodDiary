<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>我的美食與足跡日記</title>

  <!-- PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#FAF8F5" />

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Leaflet 地圖套件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #FAF8F5;
      color: #4A3E3D;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-cream: #FAF8F5;
      --card-cream: #FFFFFF;
      --accent-warm: #8C7A6B;      /* 暖木棕 */
      --accent-light: #F2ECE4;     /* 燕麥米色 */
      --marker-color: #C86D51;     /* 預設圖標：落日焦糖橘 */
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    #mapView, #map {
      width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      position: absolute !important;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .touch-btn {
      touch-action: manipulation;
      cursor: pointer;
    }

    /* 地圖圖標樣式 (預設為焦糖橘) */
    .custom-marker {
      background: var(--marker-color);
      width: 38px;
      height: 48px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(200, 109, 81, 0.35);
      border: 2px solid #FFFFFF !important;
      transition: background 0.3s ease;
    }
    .custom-marker.low-score { background: #8C827A !important; }
    .custom-marker-text {
      transform: rotate(45deg);
      color: white;
      font-weight: 800;
      font-size: 12px;
    }
  </style>
</head>
<body class="flex flex-col h-full w-full relative">

  <!-- 頂部導覽列 -->
  <header class="bg-[#FFFFFF]/95 backdrop-blur border-b border-[#EAE3D9] px-4 py-2.5 flex items-center justify-between z-30 shadow-xs relative flex-shrink-0">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-full bg-[#F2ECE4] flex items-center justify-center text-[#8C7A6B]">
        <i class="fa-solid fa-mug-hot text-sm"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-[#3D3231] leading-tight">我的美食日記</h1>
        <p class="text-[10px] text-[#9E8E81]">生活足跡與回憶手帳</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <!-- 🎨 地圖圖標調色盤 -->
      <button onclick="toggleColorPickerMenu()" title="切換圖標顏色" class="touch-btn bg-[#F2ECE4] hover:bg-[#EAE3D9] text-[#8C7A6B] p-1.5 rounded-full text-xs font-bold active:scale-95 transition">
        🎨
      </button>
      <!-- 資料備份 -->
      <button onclick="toggleBackupMenu()" title="資料備份與匯入" class="touch-btn text-[#8C7A6B] hover:bg-[#F2ECE4] p-1.5 rounded-full active:scale-95 transition">
        <i class="fa-solid fa-box-archive text-base"></i>
      </button>
      <!-- 寫篇日記 -->
      <button onclick="openManualAddModal()" class="touch-btn bg-[#C86D51] hover:bg-[#B35C42] text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center shadow-xs active:scale-95 transition">
        <i class="fa-solid fa-feather-pointed mr-1"></i> 寫一篇
      </button>
    </div>
  </header>

  <!-- 🎨 圖標調色盤選單 -->
  <div id="colorPickerMenu" class="hidden absolute top-14 right-16 bg-white shadow-2xl rounded-2xl border border-[#EAE3D9] p-3 z-[1600] w-52 text-xs space-y-2">
    <div class="font-bold text-[#5C4F44] text-[11px] mb-1">選擇地圖圖標配色：</div>
    <div class="grid grid-cols-5 gap-2">
      <button onclick="setMarkerTheme('#C86D51', '焦糖橘')" title="落日焦糖橘 (預設)" class="w-7 h-7 rounded-full bg-[#C86D51] border-2 border-white shadow-xs active:scale-90 transition"></button>
      <button onclick="setMarkerTheme('#8C7A6B', '暖木棕')" title="暖木核桃棕" class="w-7 h-7 rounded-full bg-[#8C7A6B] border-2 border-white shadow-xs active:scale-90 transition"></button>
      <button onclick="setMarkerTheme('#6B8E23', '抹茶綠')" title="日系抹茶綠" class="w-7 h-7 rounded-full bg-[#6B8E23] border-2 border-white shadow-xs active:scale-90 transition"></button>
      <button onclick="setMarkerTheme('#9C95DB', '薰衣草紫')" title="典雅薰衣草紫" class="w-7 h-7 rounded-full bg-[#9C95DB] border-2 border-white shadow-xs active:scale-90 transition"></button>
      <button onclick="setMarkerTheme('#5B8296', '霧霾藍')" title="低飽和霧霾藍" class="w-7 h-7 rounded-full bg-[#5B8296] border-2 border-white shadow-xs active:scale-90 transition"></button>
    </div>
    <p id="currentThemeNameText" class="text-[10px] text-[#9E8E81] text-center pt-1 border-t border-[#F2ECE4]">目前色調：焦糖橘</p>
  </div>

  <!-- 備份選單 -->
  <div id="backupMenu" class="hidden absolute top-14 right-4 bg-white shadow-2xl rounded-2xl border border-[#EAE3D9] p-2.5 z-[1600] w-56 text-xs space-y-1.5">
    <label class="touch-btn w-full text-left py-2 px-2.5 bg-[#FAF6F0] hover:bg-[#F2ECE4] text-[#5C4F44] rounded-xl flex items-center font-bold cursor-pointer transition">
      <i class="fa-solid fa-map-location-dot mr-2 text-[#C86D51]"></i> 匯入 Google Maps 收藏檔
      <input type="file" id="importGoogleMapsInput" accept=".json,.geojson" onchange="importGoogleMapsData(event)" class="hidden" />
    </label>
    <div class="border-t border-[#F0EBE3] my-1"></div>
    <button onclick="exportData()" class="touch-btn w-full text-left py-1.5 px-2.5 hover:bg-[#FAF8F5] rounded-xl flex items-center font-medium text-[#5C4F44]">
      <i class="fa-solid fa-download mr-2 text-[#8C7A6B]"></i> 匯出本機備份檔 (JSON)
    </button>
    <label class="touch-btn w-full text-left py-1.5 px-2.5 hover:bg-[#FAF8F5] rounded-xl flex items-center font-medium text-[#5C4F44] cursor-pointer">
      <i class="fa-solid fa-upload mr-2 text-[#8C7A6B]"></i> 還原日記備份檔
      <input type="file" id="importFileInput" accept=".json" onchange="importData(event)" class="hidden" />
    </label>
  </div>

  <!-- 主要內容區域 -->
  <main class="flex-1 relative w-full h-full overflow-hidden">
    
    <!-- 頁面 1：【點點滴滴・首頁足跡總覽】 -->
    <div id="dashboardView" class="w-full h-full overflow-y-auto px-4 py-4 pb-32 space-y-4">
      
      <!-- 溫暖手帳風格問候區 -->
      <div class="bg-gradient-to-br from-[#FFFFFF] to-[#F7F3ED] p-4 rounded-3xl border border-[#EAE3D9] shadow-xs">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-[#C86D51] bg-[#FDF2EC] px-2.5 py-1 rounded-full flex items-center">
            <i class="fa-solid fa-heart mr-1.5 text-xs text-[#C86D51]"></i> 生活回憶手帳
          </span>
          <span class="text-[11px] text-[#A6998E]" id="dashTodayDate"></span>
        </div>
        <h2 class="text-lg font-bold text-[#3D3231] leading-snug">那些走過的路，<br>都成了有滋有味的回憶。</h2>
      </div>

      <!-- 四大真實數據卡片 -->
      <div class="grid grid-cols-2 gap-2.5">
        <div class="bg-white p-3.5 rounded-2xl border border-[#EAE3D9] shadow-xs flex flex-col justify-between">
          <div class="text-[#8C7A6B] text-xs font-semibold flex items-center">
            <i class="fa-solid fa-location-dot mr-1.5 text-[#C86D51]"></i> 去過的地點
          </div>
          <div class="mt-2 flex items-baseline space-x-1">
            <span class="text-2xl font-black text-[#3D3231]" id="statUniquePlaces">0</span>
            <span class="text-[11px] text-[#9E8E81]">個地方</span>
          </div>
          <p class="text-[10px] text-[#B0A499] mt-0.5">不重複足跡地點</p>
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-[#EAE3D9] shadow-xs flex flex-col justify-between">
          <div class="text-[#8C7A6B] text-xs font-semibold flex items-center">
            <i class="fa-solid fa-map mr-1.5 text-[#C86D51]"></i> 走過的縣市
          </div>
          <div class="mt-2 flex items-baseline space-x-1">
            <span class="text-2xl font-black text-[#3D3231]" id="statUniqueCities">0</span>
            <span class="text-[11px] text-[#9E8E81]">個縣市/城市</span>
          </div>
          <p class="text-[10px] text-[#B0A499] mt-0.5">足跡遍佈的城市</p>
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-[#EAE3D9] shadow-xs flex flex-col justify-between">
          <div class="text-[#8C7A6B] text-xs font-semibold flex items-center">
            <i class="fa-solid fa-images mr-1.5 text-[#C86D51]"></i> 保存照片數
          </div>
          <div class="mt-2 flex items-baseline space-x-1">
            <span class="text-2xl font-black text-[#3D3231]" id="statTotalPhotos">0</span>
            <span class="text-[11px] text-[#9E8E81]">張回憶</span>
          </div>
          <p class="text-[10px] text-[#B0A499] mt-0.5">珍貴光影瞬間</p>
        </div>

        <div class="bg-white p-3.5 rounded-2xl border border-[#EAE3D9] shadow-xs flex flex-col justify-between">
          <div class="text-[#8C7A6B] text-xs font-semibold flex items-center">
            <i class="fa-solid fa-calendar-days mr-1.5 text-[#C86D51]"></i> 紀錄月份數
          </div>
          <div class="mt-2 flex items-baseline space-x-1">
            <span class="text-2xl font-black text-[#3D3231]" id="statTotalMonths">0</span>
            <span class="text-[11px] text-[#9E8E81]">個月份</span>
          </div>
          <p class="text-[10px] text-[#B0A499] mt-0.5">點滴時光累積</p>
        </div>
      </div>

      <!-- 快速記一篇捷徑 -->
      <div class="bg-[#F2ECE4] p-3 rounded-2xl border border-[#E2D8CC] flex items-center justify-between">
        <div class="flex items-center space-x-2 text-xs text-[#5C4F44]">
          <span class="w-2 h-2 rounded-full bg-[#C86D51] animate-pulse"></span>
          <span>今天又發現了什麼好地方嗎？</span>
        </div>
        <button onclick="openManualAddModal()" class="touch-btn bg-[#C86D51] hover:bg-[#B35C42] text-white px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-xs active:scale-95 transition">
          立刻記錄
        </button>
      </div>

      <!-- 最近造訪的回憶 (照片日記卡片) -->
      <div class="space-y-2.5">
        <div class="flex items-center justify-between">
          <h3 class="text-xs font-bold text-[#5C4F44] tracking-wide flex items-center">
            <i class="fa-solid fa-clock-rotate-left mr-1.5 text-[#C86D51]"></i> 最近造訪的回憶
          </h3>
          <button onclick="switchTab('list')" class="text-[11px] text-[#C86D51] font-semibold hover:underline">
            查看全部紀錄 →
          </button>
        </div>

        <div id="recentMemoriesCards" class="space-y-3"></div>
      </div>
    </div>

    <!-- 頁面 2：【足跡地圖】 -->
    <div id="mapView" class="hidden w-full h-full relative">
      <div class="absolute top-3 left-3 right-3 z-[900] max-w-md mx-auto">
        <div class="bg-white/95 backdrop-blur rounded-2xl shadow-md border border-[#EAE3D9] p-2 flex items-center space-x-2">
          <i class="fa-solid fa-magnifying-glass text-[#C86D51] ml-2"></i>
          <input type="text" id="homeSearchInput" placeholder="搜尋想念的店名、景點、地址..." oninput="handleSearch(this.value)" class="w-full text-xs outline-none bg-transparent py-1 font-medium text-[#4A3E3D]" />
          <button onclick="clearSearch()" id="clearSearchBtn" class="touch-btn hidden text-gray-400 hover:text-gray-600 p-1 text-xs">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>
        <div id="searchResultsCard" class="hidden mt-2 bg-white rounded-2xl shadow-xl border border-[#EAE3D9] max-h-72 overflow-y-auto p-2 space-y-1.5"></div>
      </div>

      <!-- GPS 定位按鈕 (微調高度避免與懸浮列重疊) -->
      <button onclick="locateUser()" title="定位我的位置" class="touch-btn absolute bottom-24 right-4 z-[900] bg-white text-[#5C4F44] hover:text-[#C86D51] w-11 h-11 rounded-full shadow-lg flex items-center justify-center border border-[#EAE3D9] active:scale-90 transition">
        <i class="fa-solid fa-crosshairs text-lg"></i>
      </button>

      <div id="map"></div>
    </div>

    <!-- 頁面 3：【日記列表】 -->
    <div id="listView" class="hidden w-full h-full bg-[#FAF8F5] overflow-y-auto px-4 py-3 pb-32 absolute inset-0 z-10">
      <div class="bg-white p-3.5 rounded-2xl shadow-xs mb-3 space-y-2.5 border border-[#EAE3D9]">
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="font-bold text-[#5C4F44]">1. 選擇國家</label>
            <select id="filterCountry" onchange="onCountryChange()" class="w-full mt-1 bg-[#FAF8F5] border border-[#EAE3D9] rounded-lg p-2 font-medium text-[#4A3E3D] outline-none">
            </select>
          </div>
          <div>
            <label class="font-bold text-[#5C4F44]">2. 選擇城市</label>
            <select id="filterCity" onchange="onCityChange()" disabled class="w-full mt-1 bg-gray-100 text-gray-400 border border-[#EAE3D9] rounded-lg p-2 font-medium outline-none transition cursor-not-allowed">
              <option value="">請先選擇國家</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label class="font-bold text-[#5C4F44]">🏷️ 標籤分類</label>
            <select id="filterTag" onchange="renderListView()" class="w-full mt-1 bg-[#FAF8F5] border border-[#EAE3D9] rounded-lg p-2 font-medium text-[#4A3E3D]">
            </select>
          </div>
          <div>
            <label class="font-bold text-[#5C4F44]">⭐ 評分篩選</label>
            <select id="filterRating" onchange="renderListView()" class="w-full mt-1 bg-[#FAF8F5] border border-[#EAE3D9] rounded-lg p-2 font-medium text-[#4A3E3D]">
              <option value="all">不限分數</option>
              <option value="gte_4.5">4.5 星以上</option>
              <option value="gte_4.0">4.0 星以上</option>
              <option value="gte_3.0">3.0 星以上</option>
              <option value="lt_3.0">⚠️ 未滿 3.0 星 (避雷區)</option>
            </select>
          </div>
        </div>

        <div class="text-xs">
          <label class="font-bold text-[#5C4F44]">🔄 排序方式</label>
          <select id="sortOrder" onchange="renderListView()" class="w-full mt-1 bg-[#FAF8F5] border border-[#EAE3D9] rounded-lg p-2 font-medium text-[#4A3E3D]">
            <option value="date_desc">造訪日期：最新到最舊</option>
            <option value="date_asc">造訪日期：最舊到最新</option>
            <option value="rating_desc">評分：高到低</option>
            <option value="visits_desc">造訪次數：多到少</option>
          </select>
        </div>
      </div>

      <div id="restaurantCards" class="space-y-3"></div>
    </div>
  </main>

  <!-- 【全新亮點 2】：現代感膠囊「懸浮導覽列」 (去除大片白邊、不換行、純粹文字) -->
  <nav class="fixed bottom-4 left-4 right-4 max-w-xs mx-auto z-[1000] pointer-events-auto mb-[env(safe-area-inset-bottom,0px)]">
    <div class="bg-white/95 backdrop-blur-md border border-[#EAE3D9] rounded-full shadow-2xl px-2 py-1.5 flex justify-around items-center">
      <button onclick="switchTab('dashboard')" id="tabDashBtn" class="touch-btn flex flex-col items-center text-[#C86D51] font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap">
        <i class="fa-solid fa-sparkles text-base mb-0.5"></i>
        點點滴滴
      </button>
      <button onclick="switchTab('map')" id="tabMapBtn" class="touch-btn flex flex-col items-center text-gray-400 font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap">
        <i class="fa-solid fa-map-location-dot text-base mb-0.5"></i>
        足跡地圖
      </button>
      <!-- 日記列表不再顯示括號數字，徹底解決折行問題 -->
      <button onclick="switchTab('list')" id="tabListBtn" class="touch-btn flex flex-col items-center text-gray-400 font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap">
        <i class="fa-solid fa-book-bookmark text-base mb-0.5"></i>
        日記列表
      </button>
    </div>
  </nav>

  <!-- 彈跳表單視窗 -->
  <div id="entryModal" class="hidden fixed inset-0 bg-black/60 z-[2000] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full sm:max-w-md max-h-[90dvh] rounded-t-3xl sm:rounded-3xl flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-3.5 border-b border-[#EAE3D9] flex justify-between items-center bg-[#FAF8F5]">
        <div>
          <h3 class="font-bold text-[#3D3231] text-sm" id="modalMainTitle">記錄回憶足跡</h3>
          <p class="text-[10px] text-[#C86D51]">記下此時此刻的感動</p>
        </div>
        <button onclick="closeModal()" class="touch-btn text-gray-400 hover:text-gray-600 text-2xl leading-none">&times;</button>
      </div>

      <div class="p-5 overflow-y-auto space-y-3.5 text-xs pb-10">
        <div class="bg-[#F5F0E8] p-3 rounded-2xl border border-[#EAE3D9] space-y-2.5">
          <div>
            <label class="block font-bold text-[#5C4F44] text-[11px] mb-1">地點 / 店家名稱 *</label>
            <input type="text" id="inputStoreName" placeholder="輸入地點名稱 (例: 鴨肉許、司馬庫斯)" class="w-full bg-white font-bold text-gray-900 text-sm rounded-xl p-2 outline-none border border-[#E0D7CC]" />
          </div>
          
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-gray-600 font-medium text-[10px] mb-0.5">國家</label>
              <input type="text" id="inputCountry" placeholder="國家" class="w-full bg-white border border-[#E0D7CC] rounded-lg p-1.5 text-xs outline-none" />
            </div>
            <div>
              <label class="block text-gray-600 font-medium text-[10px] mb-0.5">城市 / 縣市</label>
              <input type="text" id="inputCity" placeholder="縣市 (例: 新竹市)" class="w-full bg-white border border-[#E0D7CC] rounded-lg p-1.5 text-xs outline-none" />
            </div>
          </div>
          
          <div>
            <label class="block text-gray-600 font-medium text-[10px] mb-0.5">詳細地址 (選填)</label>
            <input type="text" id="inputStoreAddress" placeholder="輸入路名、地址或備註位置" class="w-full bg-white border border-[#E0D7CC] rounded-lg p-1.5 text-xs outline-none" />
          </div>

          <!-- 方法一：地圖自動查找 -->
          <button type="button" onclick="autoSearchRestaurantLocation()" class="touch-btn w-full bg-[#8C7A6B] hover:bg-[#786759] text-white py-2 rounded-xl font-bold text-xs transition shadow-xs flex items-center justify-center space-x-1.5 active:scale-95">
            <i class="fa-solid fa-magnifying-glass-location text-sm"></i>
            <span>方法一：地圖自動查找此地點</span>
          </button>

          <!-- 方法二：輸入座標 -->
          <div class="bg-white/95 p-2.5 rounded-xl border border-[#E0D7CC] space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="font-bold text-[#5C4F44] text-[11px]">📍 方法二：位置錯誤？貼上 Google 座標更正</label>
              <button type="button" onclick="pasteFromClipboard()" class="text-[#C86D51] font-bold text-[10px] underline">
                貼上剪貼簿
              </button>
            </div>
            <div class="flex items-center space-x-1.5">

  <!-- IndexedDB 本機資料庫 -->
  <script>
    let db;
    const DB_NAME = "FreeFoodDiaryDB_v12";
    const STORE_NAME = "restaurants";

    function initDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: "id" });
          };
          req.onsuccess = (e) => { db = e.target.result; resolve(); };
          req.onerror = () => resolve();
        } catch(e) { resolve(); }
      });
    }

    function dbGetAll() {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        try {
          const tx = db.transaction([STORE_NAME], "readonly");
          const req = tx.objectStore(STORE_NAME).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        } catch(e) { resolve([]); }
      });
    }

    function dbPut(item) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        try {
          const tx = db.transaction([STORE_NAME], "readwrite");
          tx.objectStore(STORE_NAME).put(item);
          tx.oncomplete = () => resolve();
        } catch(e) { resolve(); }
      });
    }

    function dbDelete(id) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        try {
          const tx = db.transaction([STORE_NAME], "readwrite");
          tx.objectStore(STORE_NAME).delete(id);
          tx.oncomplete = () => resolve();
        } catch(e) { resolve(); }
      });
    }
  </script>

    function updateDashboardStats() {
      document.getElementById("statUniquePlaces").innerText = appData.length;

      const citySet = new Set();
      let totalPhotos = 0;
      const monthSet = new Set();
      const allMemories = [];

      appData.forEach(store => {
        if (store.city && store.city.trim()) {
          citySet.add(store.city.trim());
        }

        const visits = store.visits || [];
        visits.forEach(v => {
          const photos = getVisitPhotos(v);
          totalPhotos += photos.length;
          if (v.date) monthSet.add(v.date.substring(0, 7));

          allMemories.push({
            storeId: store.id,
            storeName: store.name,
            country: store.country,
            city: store.city,
            visitId: v.visitId,
            date: v.date,
            rating: v.rating,
            review: v.review,
            revisit: v.revisit,
            photos: photos
          });
        });
      });

      document.getElementById("statUniqueCities").innerText = citySet.size;
      document.getElementById("statTotalPhotos").innerText = totalPhotos;
      document.getElementById("statTotalMonths").innerText = monthSet.size;

      allMemories.sort((a, b) => new Date(b.date) - new Date(a.date));

    function renderRecentMemories(recentList) {

            </div>

    }

    let searchTimeout = null;
    function handleSearch(val) {
      clearTimeout(searchTimeout);
      const card = document.getElementById("searchResultsCard");
      const clearBtn = document.getElementById("clearSearchBtn");

      if (!val || !val.trim()) {
        card.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      clearBtn.classList.remove("hidden");
      const v = val.trim().toLowerCase();

      const localMatches = appData.filter(s => 
        (s.name && s.name.toLowerCase().includes(v)) || 
        (s.address && s.address.toLowerCase().includes(v)) ||
        (s.city && s.city.toLowerCase().includes(v)) ||
        (s.tags && s.tags.some(t => t.toLowerCase().includes(v)))
      );

      searchTimeout = setTimeout(() => {
        let html = "";
        if (localMatches.length > 0) {
          html += `<div class="text-[10px] font-bold text-[#C86D51] px-2 py-0.5">我的日記中已有記錄：</div>`;
          localMatches.forEach(item => {
            html += `
              <div onclick="quickFlyTo('${item.name.replace(/'/g, "\\'")}', ${item.lat}, ${item.lng})" class="touch-btn flex items-center justify-between p-2 hover:bg-[#FDF2EC] rounded-xl cursor-pointer">
                <div>
                  <h4 class="font-bold text-[#3D3231] text-xs">${item.name}</h4>
                  <p class="text-[10px] text-[#9E8E81] truncate">${item.city} · ${item.address || ''}</p>
                </div>
                <span class="text-[10px] bg-[#FDF2EC] text-[#C86D51] px-2 py-0.5 rounded-full font-bold whitespace-nowrap">前往</span>
              </div>
            `;
          });
        }

        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&countrycodes=tw,jp&limit=4&accept-language=zh-TW`)
          .then(res => res.json())
          .then(results => {
            if (results && results.length > 0) {
              html += `<div class="text-[10px] font-bold text-gray-400 px-2 py-0.5 mt-1">地圖外部地點：</div>`;
              results.forEach(place => {
                const parts = place.display_name.split(',');
                const title = parts[0];
                const cleanAddress = parts.slice(1, 4).join(',');
                html += `
                  <div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-xl">
                    <div class="pr-2 truncate cursor-pointer" onclick="quickFlyTo('${title.replace(/'/g, "\\'")}', ${place.lat}, ${place.lon})">
                      <h4 class="font-bold text-gray-800 text-xs truncate">${title}</h4>
                      <p class="text-[10px] text-gray-400 truncate">${cleanAddress}</p>
                    </div>
                    <button onclick="selectAndAddFromSearch('${title.replace(/'/g, "\\'")}', '${cleanAddress.replace(/'/g, "\\'")}', ${place.lat}, ${place.lon})" class="touch-btn bg-[#C86D51] text-white text-[11px] font-bold px-2.5 py-1 rounded-xl shadow-xs whitespace-nowrap active:scale-95">
                      記這家
                    </button>
                  </div>
                `;
              });
            }

            if (!html) {
              html = `<div class="p-3 text-center text-xs text-gray-400">查無結果，可直接點「寫篇日記」記錄</div>`;
            }
            card.innerHTML = html;
            card.classList.remove("hidden");
          })
          .catch(() => {
            if (html) { card.innerHTML = html; card.classList.remove("hidden"); }
          });
      }, 350);
    }

    function clearSearch() {
      document.getElementById("homeSearchInput").value = "";
      handleSearch("");

    function quickFlyTo(storeName, lat, lng) {
      document.getElementById("homeSearchInput").value = storeName;

    async function autoSearchRestaurantLocation() {
      const name = document.getElementById("inputStoreName").value.trim();
      const city = document.getElementById("inputCity").value.trim();
      const address = document.getElementById("inputStoreAddress").value.trim();
      const statusText = document.getElementById("geoStatusText");

      if (!name) return alert("請先填寫「地點名稱」！");

      statusText.innerText = "🔍 正在地圖搜尋該地點...";
      const queryList = [
        `${city} ${name} ${address}`.trim(),
        `${city} ${name}`.trim(),
        `${name}`.trim()
      ];

      let foundCoords = null;
      for (const q of queryList) {
        if (!q) continue;
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&countrycodes=tw,jp&limit=1&accept-language=zh-TW`);
          const data = await res.json();
          if (data && data.length > 0) {
            foundCoords = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
            break;
          }
        } catch(e) {}
      }

      if (foundCoords) {
        pendingLocation = foundCoords;
        document.getElementById("inputCoords").value = `${foundCoords.lat.toFixed(5)}, ${foundCoords.lng.toFixed(5)}`;
        statusText.innerText = `✅ 方法一查找成功！(${foundCoords.lat.toFixed(4)}, ${foundCoords.lng.toFixed(4)}) 若有偏差可在方法二貼座標修正`;
        statusText.className = "text-[10px] text-center font-bold text-green-600";
        if (map) map.flyTo([foundCoords.lat, foundCoords.lng], 16);
      } else {
        let cityFallback = TAIWAN_CITIES[city] || [24.8138, 120.9675];
        pendingLocation = { lat: cityFallback[0], lng: cityFallback[1] };
        statusText.innerText = `⚠️ 查無此地點，已先暫設在 ${city || '當地'} 中心，請直接在下方【方法二】貼上正確座標修正！`;
        statusText.className = "text-[10px] text-center font-bold text-amber-600";
      }
    }

    function handleManualCoordsInput(val) {
      if (!val || !val.trim()) return;
      const match = val.match(/([0-9]+\.[0-9]+)[,\s]+([0-9]+\.[0-9]+)/);
      if (match) {
        const lat = parseFloat(match[1]);
        const lng = parseFloat(match[2]);
        pendingLocation = { lat: lat, lng: lng };

        const statusText = document.getElementById("geoStatusText");
        statusText.innerText = `🎯 方法二已強制鎖定此座標！(${lat.toFixed(5)}, ${lng.toFixed(5)})`;
        statusText.className = "text-[10px] text-center font-bold text-[#C86D51] animate-pulse";

        if (map) map.flyTo([lat, lng], 16);
      }
    }

    function applyManualCoordsNow() {
      const val = document.getElementById("inputCoords").value.trim();
      if (!val) return alert("請先填入或貼上經緯度座標！");
      handleManualCoordsInput(val);
      alert("✅ 已成功鎖定該座標！點擊下方「存入回憶手帳」即可完成保存。");
    }

    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("inputCoords").value = text;
        handleManualCoordsInput(text);
      } catch(e) {
        alert("請長按輸入框貼上座標！");
      }
    }

    function autoLocateCurrentSpot() {
      if (!navigator.geolocation) return alert("手機不支援 GPS 定位！");
      const statusText = document.getElementById("geoStatusText");
      statusText.innerText = "🛰️ 正在讀取手機現場真實 GPS 座標...";

      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          pendingLocation = { lat, lng };
          document.getElementById("inputCoords").value = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          statusText.innerText = `✅ 現場定位成功！(${lat.toFixed(4)}, ${lng.toFixed(4)})`;
          statusText.className = "text-[10px] text-center font-bold text-green-600";
          if (map) map.flyTo([lat, lng], 16);

          try {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=zh-TW`);
            const data = await res.json();
            if (data && data.address) {
              if (data.address.country) document.getElementById("inputCountry").value = data.address.country;
              const city = data.address.city || data.address.county || data.address.town || "";
              if (city) document.getElementById("inputCity").value = city;
              const road = (data.address.road || "") + (data.address.house_number ? data.address.house_number + "號" : "");
              if (road) document.getElementById("inputStoreAddress").value = road;
            }
          } catch(e) {}
        },
        () => { statusText.innerText = "❌ 定位失敗，請確認手機已開啟定位權限！"; },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    async function importGoogleMapsData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          let count = 0;
          const json = JSON.parse(e.target.result);
          const features = json.features || (Array.isArray(json) ? json : []);

          if (!features.length) return alert("檔案內無地點資料，請確認是 Google Maps 匯出的 JSON 檔案！");

          for (const f of features) {
            const coords = f.geometry?.coordinates;
            const props = f.properties || {};
            const title = props.Title || props.name || props.title;

            if (coords && coords.length >= 2 && title) {
              const address = props.Address || props.address || "";
              let city = "新竹市";
              for (const c in TAIWAN_CITIES) {
                if (address.includes(c)) { city = c; break; }
              }

              const newStore = {
                id: "store_g_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                name: title,
                country: "台灣",
                city: city,
                address: address,
                lat: coords[1],
                lng: coords[0],
                tags: ["回憶收藏"],
                visits: [{
                  visitId: "v_" + Date.now(),
                  date: new Date().toISOString().split("T")[0],
                  rating: 5.0,
                  cost: null,
                  revisit: true,
                  review: props.Comment || props.Note || "Google Maps 收藏紀錄",
                  photos: []
                }]
              };
              await dbPut(newStore);
              count++;
            }
          }

          appData = await dbGetAll();
          refreshViews();
          updateDashboardStats();
          alert(`🎉 成功匯入了 ${count} 個足跡地點！已全數同步至日記。`);
        } catch(err) {
          alert("匯入失敗，請確認檔案格式是否正確。");
        }
      };
      reader.readAsText(file);
      toggleBackupMenu();
    }

    async function handlePhotosSelect(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;
      for (const file of files) {
        const base64 = await compressSingleImage(file);
        uploadedPhotosList.push(base64);
      }
      event.target.value = "";
      renderPhotosThumbnails();
    }

    function compressSingleImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            const maxDim = 850;
            if (w > maxDim) {
              h = Math.round((maxDim / w) * h);
              w = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.72));
          };
        };
        reader.readAsDataURL(file);
      });
    }

    async function confirmSaveRecord() {
      const name = document.getElementById("inputStoreName").value.trim();
      const country = document.getElementById("inputCountry").value.trim() || "台灣";
      const city = document.getElementById("inputCity").value.trim() || "新竹市";
      const address = document.getElementById("inputStoreAddress").value.trim();
      const date = document.getElementById("inputDate").value;
      const cost = document.getElementById("inputCost").value;
      const review = document.getElementById("inputReview").value;
      const revisit = document.getElementById("inputRevisit").checked;
      const tags = document.getElementById("inputTags").value.split(/[,，\s]+/).filter(Boolean);

      if (!name) return alert("請輸入地點名稱！");

      const manualCoordsInputVal = document.getElementById("inputCoords").value.trim();
      if (manualCoordsInputVal) {
        const match = manualCoordsInputVal.match(/([0-9]+\.[0-9]+)[,\s]+([0-9]+\.[0-9]+)/);
        if (match) {
          pendingLocation = { lat: parseFloat(match[1]), lng: parseFloat(match[2]) };
        }
      }

      let finalCoords = pendingLocation;
      if (!finalCoords) {
        for (const c in TAIWAN_CITIES) {
          if (city.includes(c) || address.includes(c)) {
            finalCoords = { lat: TAIWAN_CITIES[c][0], lng: TAIWAN_CITIES[c][1] };
            break;
          }
        }
      }
      if (!finalCoords) finalCoords = { lat: 24.8138, lng: 120.9675 };

      const photosToSave = [...uploadedPhotosList];

      if (currentModalMode === 'EDIT') {
        const store = appData.find(s => s.id === editingStoreId);
        if (store) {
          store.name = name;
          store.country = country;
          store.city = city;
          store.address = address;
          store.lat = finalCoords.lat;
          store.lng = finalCoords.lng;
          store.tags = tags;
          const visit = store.visits.find(v => v.visitId === editingVisitId);
          if (visit) {
            visit.date = date;
            visit.rating = currentRatingValue;
            visit.cost = cost ? Number(cost) : null;
            visit.review = review;
            visit.revisit = revisit;
            visit.photos = photosToSave;
            delete visit.photo;
          }
          await dbPut(store);
        }
      } else if (currentModalMode === 'REVISIT') {
        const store = appData.find(s => s.id === editingStoreId);
        if (store) {
          store.visits.unshift({
            visitId: "v_" + Date.now(),
            date: date,
            rating: currentRatingValue,
            cost: cost ? Number(cost) : null,
            revisit: revisit,
            review: review,
            photos: photosToSave
          });
          store.tags = Array.from(new Set([...store.tags, ...tags]));
          await dbPut(store);
        }
      } else {
        const newStore = {
          id: "store_" + Date.now(),
          name: name,
          country: country,
          city: city,
          address: address,
          lat: finalCoords.lat,
          lng: finalCoords.lng,
          tags: tags.length ? tags : ["回憶"],
          visits: [{
            visitId: "v_" + Date.now(),
            date: date,
            rating: currentRatingValue,
            cost: cost ? Number(cost) : null,
            revisit: revisit,
            review: review,
            photos: photosToSave
          }]
        };
        await dbPut(newStore);
        appData.unshift(newStore);
      }

      closeModal();
      refreshViews();
      updateDashboardStats();
    }

    async function deleteCurrentEditingVisit() {
      if (!editingStoreId) return;
      const store = appData.find(s => s.id === editingStoreId);
      if (!store) return;

      if (store.visits.length <= 1) {
        if (confirm(`這是「${store.name}」唯一的紀錄，刪除將一併移除該地點與標記。確定要刪除嗎？`)) {
          await dbDelete(editingStoreId);
          appData = appData.filter(s => s.id !== editingStoreId);
          closeModal();
          refreshViews();
          updateDashboardStats();
          alert("✅ 已成功刪除！");
        }
        return;
      }

      if (confirm(`確定要刪除「${store.name}」這一次的拜訪筆記嗎？其他次紀錄將會保留。`)) {
        store.visits = store.visits.filter(v => v.visitId !== editingVisitId);
        await dbPut(store);
        closeModal();
        refreshViews();
        updateDashboardStats();
        alert("✅ 已成功刪除該次筆記！");
      }
    }

    async function deleteRestaurant(storeId) {
      const store = appData.find(s => s.id === storeId);
      if (!store) return;
      if (confirm(`確定要徹底刪除「${store.name}」及其所有拜訪紀錄與照片嗎？`)) {
        await dbDelete(storeId);
        appData = appData.filter(s => s.id !== storeId);
        refreshViews();
        updateDashboardStats();
        alert("✅ 已成功刪除！");
      }
    }

    async function deleteSingleVisit(storeId, visitId) {
      const store = appData.find(s => s.id === storeId);
      if (!store) return;

      if (store.visits.length <= 1) {
        await deleteRestaurant(storeId);
        return;
      }

      if (confirm(`確定要刪除這一次的筆記嗎？`)) {
        store.visits = store.visits.filter(v => v.visitId !== visitId);
        await dbPut(store);
        refreshViews();
        updateDashboardStats();
        alert("✅ 已成功刪除該次筆記！");
      }
    }

          iconSize: [38, 48],
          iconAnchor: [19, 48],

          ? `<span style="color:#C86D51; font-weight:900; background:#FAF0E6; padding:2px 6px; border-radius:6px;">值得再訪 👍</span>`

             </div>` 
          : '';

            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
              <span style="font-size:10px; background:#F2ECE4; color:#8C7A6B; padding:1px 6px; border-radius:4px; font-weight:bold;">${item.country || ''} · ${item.city || ''}</span>
              ${item.visits.length > 1 ? `<span style="font-size:10px; background:#FAF0E6; color:#C86D51; padding:1px 6px; border-radius:4px; font-weight:bold;">已訪 ${item.visits.length} 次</span>` : ''}
            </div>
            ${photoHtml}
            <h4 style="margin:0 0 2px; font-weight:bold; font-size:13px; color:#3D3231;">${item.name}</h4>
            <div style="font-size:11px; margin-bottom:4px;"><b style="color:var(--marker-color); font-size:13px;">★ ${latest.rating.toFixed(1)}</b> ${revisitBadge}</div>

            <button onclick="openEditModal('${item.id}', '${latest.visitId}')" class="touch-btn" style="width:100%; background:#FAF8F5; color:#5C4F44; border:1px solid #EAE3D9; border-radius:8px; padding:4px 0; font-size:11px; font-weight:bold;">✏️ 編輯回憶筆記</button>
          </div>
        `;

        L.marker([item.lat, item.lng], { icon: icon, recordId: item.id }).bindPopup(content).addTo(markersLayer);
      });
    }

    function renderListView() {
      const countryFilter = document.getElementById("filterCountry").value;
      const cityFilter = document.getElementById("filterCity").value;
      const tagFilter = document.getElementById("filterTag").value;
      const ratingFilter = document.getElementById("filterRating").value;
      const sortOrder = document.getElementById("sortOrder").value;

      let list = [...appData];
      if (countryFilter) list = list.filter(i => i.country === countryFilter);
      if (cityFilter) list = list.filter(i => i.city === cityFilter);
      if (tagFilter) list = list.filter(i => (i.tags || []).includes(tagFilter));
      if (ratingFilter === "gte_4.5") list = list.filter(i => i.visits[0]?.rating >= 4.5);
      else if (ratingFilter === "lt_3.0") list = list.filter(i => i.visits[0]?.rating < 3.0);

      list.sort((a, b) => {
        const da = a.visits[0]?.date || "";
        const db = b.visits[0]?.date || "";
        const ra = a.visits[0]?.rating || 0;
        const rb = b.visits[0]?.rating || 0;

        if (sortOrder === "date_desc") return new Date(db) - new Date(da);
        if (sortOrder === "date_asc") return new Date(da) - new Date(db);
        if (sortOrder === "rating_desc") return rb - ra;
        if (sortOrder === "visits_desc") return b.visits.length - a.visits.length;
        return 0;
      });

      const container = document.getElementById("restaurantCards");

      if (!list.length) {
        container.innerHTML = `<div class="text-center text-[#9E8E81] py-12 text-xs">查無符合的回憶日記</div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const latest = item.visits[0];

        if (photos.length === 1) {
          photosRenderHtml = `<img src="${photos[0]}" class="w-full h-44 object-cover rounded-2xl border border-[#F0EBE3]" />`;
        } else if (photos.length > 1) {

                  <div class="flex-shrink-0 w-[78%] h-44 snap-center rounded-2xl overflow-hidden border border-[#F0EBE3] relative">
                    <img src="${p}" class="w-full h-full object-cover" />
                    <span class="absolute bottom-2 right-2 bg-black/60 text-white text-[9px] font-bold px-2 py-0.5 rounded-full">
                      ${pIdx + 1} / ${photos.length}
                    </span>
                  </div>
                `).join('')}
              </div>
              <span class="text-[9px] text-[#A6998E] block text-right mt-0.5 font-medium">👈 左右滑動查看 ${photos.length} 張照片</span>
            </div>
          `;
        }

        return `
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-[#EAE3D9] flex flex-col space-y-3">
            <div class="flex justify-between items-start">
              <div>
                <span class="bg-[#F2ECE4] text-[#8C7A6B] text-[10px] px-2 py-0.5 rounded-full font-bold">${item.country || ''} · ${item.city || ''}</span>
                <h3 class="font-bold text-[#3D3231] text-sm mt-0.5">${item.name}</h3>
                <p class="text-[11px] text-[#A6998E]">${item.address || '無詳細地址'}</p>

      document.getElementById("inputCoords").value = `${store.lat.toFixed(5)}, ${store.lng.toFixed(5)}`;
      document.getElementById("geoStatusText").innerText = `目前座標: (${store.lat.toFixed(4)}, ${store.lng.toFixed(4)})`;
      document.getElementById("inputReview").value = visit.review || "";
      document.getElementById("inputCost").value = visit.cost || "";
      document.getElementById("inputDate").value = visit.date;
      document.getElementById("inputTags").value = (store.tags || []).join(', ');
      document.getElementById("modalDeleteBtn").classList.remove("hidden");

      renderPhotosThumbnails();
      setRating(visit.rating);
      document.getElementById("entryModal").classList.remove("hidden");
    }

    function closeModal() { document.getElementById("entryModal").classList.add("hidden"); }

    function buildStarsUI() {
      const container = document.getElementById("starContainer");
      container.innerHTML = "";
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement("span");
        star.className = "touch-btn inline-block cursor-pointer";
        star.onclick = (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          let val = (e.clientX - rect.left) < (rect.width / 2) ? i - 0.5 : i;
          setRating(val);
        };
        star.id = `star_${i}`;
        container.appendChild(star);
      }
      setRating(4.5);
    }

    function setRating(val) {
      currentRatingValue = val;
      document.getElementById("inputRatingNumber").value = val.toFixed(1);
      document.getElementById("starScoreLabel").innerText = `${val.toFixed(1)} 分`;
      for (let i = 1; i <= 5; i++) {
        const s = document.getElementById(`star_${i}`);
        if (!s) continue;
        if (val >= i) s.innerHTML = '<i class="fa-solid fa-star text-amber-400"></i>';
        else if (val >= i - 0.5) s.innerHTML = '<i class="fa-solid fa-star-half-stroke text-amber-400"></i>';
        else s.innerHTML = '<i class="fa-regular fa-star text-gray-300"></i>';
      }
    }

    function handleNumberInput(val) {
      let num = parseFloat(val) || 1.0;
      setRating(Math.round(num * 2) / 2);
    }

    // 分頁切換 (焦糖橘色高亮選中)
    function switchTab(tab) {
      const dashView = document.getElementById("dashboardView");
      const mapView = document.getElementById("mapView");
      const listView = document.getElementById("listView");
      const tabDashBtn = document.getElementById("tabDashBtn");
      const tabMapBtn = document.getElementById("tabMapBtn");
      const tabListBtn = document.getElementById("tabListBtn");

      dashView.classList.add("hidden");
      mapView.classList.add("hidden");
      listView.classList.add("hidden");

      tabDashBtn.className = "touch-btn flex flex-col items-center text-gray-400 font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap";
      tabMapBtn.className = "touch-btn flex flex-col items-center text-gray-400 font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap";
      tabListBtn.className = "touch-btn flex flex-col items-center text-gray-400 font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap";

      if (tab === 'dashboard') {
        dashView.classList.remove("hidden");
        tabDashBtn.className = "touch-btn flex flex-col items-center text-[#C86D51] font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap";
        updateDashboardStats();
      } else if (tab === 'map') {
        mapView.classList.remove("hidden");
        tabMapBtn.className = "touch-btn flex flex-col items-center text-[#C86D51] font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap";
        setTimeout(() => { if (map) map.invalidateSize(); }, 150);
      } else {
        listView.classList.remove("hidden");
        tabListBtn.className = "touch-btn flex flex-col items-center text-[#C86D51] font-bold text-[11px] py-1 px-3 transition active:scale-95 whitespace-nowrap";
        renderListView();
      }
    }

    function locateUser() {
      if (!navigator.geolocation) return alert("手機不支援 GPS 定位");
      navigator.geolocation.getCurrentPosition((pos) => {
        if (map) map.flyTo([pos.coords.latitude, pos.coords.longitude], 15);
      });
    }

    function toggleBackupMenu() { document.getElementById("backupMenu").classList.toggle("hidden"); }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `點點滴滴_生活回憶手帳備份_${new Date().toISOString().split("T")[0]}.json`;
      a.click();
      toggleBackupMenu();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const list = JSON.parse(e.target.result);
          if (Array.isArray(list)) {
            for (const item of list) await dbPut(item);
            appData = await dbGetAll();
            refreshViews();
            updateDashboardStats();
            alert(`✅ 還原成功！已載入 ${list.length} 筆回憶紀錄。`);
          }
        } catch { alert("匯入失敗，請確認檔案格式是否正確。"); }
      };
      reader.readAsText(file);
      toggleBackupMenu();
    }

    window.onload = initApp;
  </script>
</body>
</html>
