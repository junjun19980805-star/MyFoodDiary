<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>我的美食日記</title>

  <!-- PWA 設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#9C95DB" />

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Leaflet 地圖套件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }

    :root {
      --theme-color: #9C95DB;
      --theme-hover: #887FCB;
      --theme-light: #F2F0FB;
      --theme-text-light: #52479B;
    }

    .bg-theme { background-color: var(--theme-color) !important; }
    .bg-theme-hover:hover { background-color: var(--theme-hover) !important; }
    .bg-theme-light { background-color: var(--theme-light) !important; }
    .text-theme { color: var(--theme-color) !important; }
    .text-theme-dark { color: var(--theme-text-light) !important; }
    .border-theme { border-color: var(--theme-color) !important; }
    .accent-theme { accent-color: var(--theme-color) !important; }

    /* 關鍵修復：強制讓地圖容器撐開，絕對不變空白 */
    #mapView, #map {
      width: 100% !important;
      height: 100% !important;
      min-height: 100% !important;
      position: absolute !important;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    .custom-marker {
      background: var(--theme-color);
      width: 38px;
      height: 48px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      border: 2px solid #FFFFFF !important;
      transition: all 0.2s ease;
    }
    .custom-marker.low-score { background: #64748B !important; }
    .custom-marker-text {
      transform: rotate(45deg);
      color: white;
      font-weight: 800;
      font-size: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col h-screen overflow-hidden select-none">

  <!-- 頂部導覽列 -->
  <header class="bg-white border-b border-gray-150 px-4 py-2.5 flex items-center justify-between z-10 shadow-sm relative">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-full bg-theme-light flex items-center justify-center">
        <i class="fa-solid fa-book-bookmark text-theme text-base"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-gray-900 leading-tight">我的美食日記</h1>
        <p class="text-[10px] text-gray-400">私人專屬 · 永久免費保存</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button onclick="toggleBackupMenu()" title="資料備份" class="text-gray-400 hover:text-theme p-1.5 rounded-full active:scale-95 transition">
        <i class="fa-solid fa-box-archive text-base"></i>
      </button>
      <button onclick="openManualAddModal()" class="bg-theme bg-theme-hover text-white px-3 py-1.5 rounded-full text-xs font-bold flex items-center shadow-md active:scale-95 transition">

    <button onclick="exportData()" class="w-full text-left py-2 px-2.5 hover:bg-theme-light rounded-xl flex items-center font-bold text-gray-700">
      <i class="fa-solid fa-download mr-2 text-theme"></i> 匯出日記備份檔

    <label class="w-full text-left py-2 px-2.5 hover:bg-theme-light rounded-xl flex items-center font-bold text-gray-700 cursor-pointer">

          <input type="text" id="homeSearchInput" placeholder="搜尋店家或地址..." oninput="handleSearch(this.value)" class="w-full text-xs outline-none bg-transparent py-1 font-medium text-gray-700" />
          <button onclick="clearSearch()" id="clearSearchBtn" class="hidden text-gray-400 hover:text-gray-600 p-1 text-xs">
            <i class="fa-solid fa-circle-xmark"></i>
          </button>
        </div>

        <div id="searchResultsCard" class="hidden mt-2 bg-white rounded-2xl shadow-2xl border border-gray-150 max-h-72 overflow-y-auto p-2 space-y-1.5"></div>
      </div>

      <!-- GPS 定位按鈕 -->
      <button onclick="locateUser()" title="定位我的位置" class="absolute bottom-6 right-4 z-[500] bg-white text-gray-700 hover:text-theme w-11 h-11 rounded-full shadow-xl flex items-center justify-center border border-gray-200 active:scale-90 transition">
        <i class="fa-solid fa-crosshairs text-lg"></i>
      </button>

      <div id="map"></div>

    <!-- 列表 View -->

        <!-- 國家 ➔ 縣市 聯動選擇 -->

              <option value="gte_4.5">4.5 星以上</option>

        </div>

        </div>

          <label class="block font-bold text-gray-700 mb-1.5">用餐照片 (自動壓縮保存)</label>

            <button type="button" onclick="appendTag('拉麵')" class="px-2 py-1 bg-gray-100 hover:bg-theme-light text-[11px] rounded-full text-gray-600">+拉麵</button>
            <button type="button" onclick="appendTag('咖啡廳')" class="px-2 py-1 bg-gray-100 hover:bg-theme-light text-[11px] rounded-full text-gray-600">+咖啡廳</button>
            <button type="button" onclick="appendTag('燒肉')" class="px-2 py-1 bg-gray-100 hover:bg-theme-light text-[11px] rounded-full text-gray-600">+燒肉</button>
          </div>
          <input type="text" id="inputTags" placeholder="自訂標籤 (多個以逗號分開)" class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs" />

        <div>

          <textarea id="inputReview" rows="3" placeholder="寫下必點招牌、用餐感受或私房避雷心得..." class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-xs leading-relaxed"></textarea>
        </div>

          <input type="checkbox" id="inputRevisit" checked class="w-4 h-4 rounded border-gray-300 accent-theme" />
          <label for="inputRevisit" class="font-bold text-gray-700 text-xs">推薦再訪 👍</label>

      <!-- 彈窗底部按鈕：含刪除 -->

          <button id="modalDeleteBtn" onclick="deleteCurrentEditingVisit()" class="hidden py-2.5 px-3 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl text-xs active:scale-95 transition flex items-center">
            <i class="fa-solid fa-trash mr-1"></i> 刪除此筆記
          </button>
          <button onclick="closeModal()" class="py-2.5 px-4 bg-gray-200 text-gray-700 font-bold rounded-xl text-xs active:scale-95">取消</button>
        </div>
        <button onclick="confirmSaveRecord()" class="flex-1 py-2.5 bg-theme bg-theme-hover text-white font-bold rounded-xl text-xs shadow-md active:scale-95 transition" id="submitBtnText">存入美食日記</button>
      </div>
    </div>

  <!-- IndexedDB 永久本機資料庫 -->
  <script>
    let db;
    const DB_NAME = "FreeFoodDiaryDB_v2";
    const STORE_NAME = "restaurants";

    function initDB() {
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(DB_NAME, 1);
          req.onupgradeneeded = (e) => {
            const d = e.target.result;
            if (!d.objectStoreNames.contains(STORE_NAME)) {
              d.createObjectStore(STORE_NAME, { keyPath: "id" });
            }
          };
          req.onsuccess = (e) => {
            db = e.target.result;
            resolve();
          };
          req.onerror = () => resolve(); // 即使被瀏覽器擋下也強制 resolve，不卡住地圖
        } catch(e) {
          resolve();
        }
      });
    }

    function dbGetAll() {
      return new Promise((resolve) => {
        if (!db) return resolve([]);
        try {
          const tx = db.transaction([STORE_NAME], "readonly");
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        } catch(e) {
          resolve([]);
        }
      });
    }

    function dbPut(item) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        try {
          const tx = db.transaction([STORE_NAME], "readwrite");
          const store = tx.objectStore(STORE_NAME);
          store.put(item);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        } catch(e) {
          resolve();
        }
      });
    }

    function dbDelete(id) {
      return new Promise((resolve) => {
        if (!db) return resolve();
        try {
          const tx = db.transaction([STORE_NAME], "readwrite");
          const store = tx.objectStore(STORE_NAME);
          store.delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => resolve();
        } catch(e) {
          resolve();
        }
      });
    }
  </script>

  <!-- 應用程式邏輯 -->
  <script>
    let appData = [];
    let map, markersLayer;
    let currentModalMode = 'CREATE';
    let editingStoreId = null;
    let editingVisitId = null;
    let currentRatingValue = 4.5;
    let uploadedPhotoBase64 = "";
    let userLocationMarker = null;
    let pendingLocation = null;

    async function initApp() {
      // 1. 先初始化地圖 (保證地圖第一時間出現，絕不留白)
      initMap();

      // 2. 異步讀取資料庫
      await initDB();
      appData = await dbGetAll();

      if (appData.length === 0) {
        const sample = {
          id: "store_sample",
          name: "隱家拉麵 赤峰店",
          country: "台灣",
          city: "台北市",
          address: "台北市大同區南京西路25巷28號",
          lat: 25.0537,
          lng: 121.5208,
          tags: ["拉麵", "排隊名店"],
          visits: [{
            visitId: "v_sample",
            date: new Date().toISOString().split("T")[0],
            rating: 5.0,
            cost: 280,
            revisit: true,
            review: "歡迎來到你的永久私密美食日記！點擊旁邊的編輯或刪除隨時可自訂紀錄。",
            photo: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=500&auto=format&fit=crop"
          }]
        };
        await dbPut(sample);
        appData = [sample];
      }

      buildStarsUI();
      refreshViews();

      // 3. 關鍵校準：強制重繪地圖尺寸，徹底解決空白問題
      setTimeout(() => {
        if (map) map.invalidateSize();
      }, 200);
    }

    function initMap() {
      // 建立地圖
      map = L.map('map', { zoomControl: false }).setView([25.045, 121.54], 13);

      // 改用最穩定、零載入失敗率的 OpenStreetMap 原生圖資
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      map.on('click', (e) => {
        pendingLocation = { lat: e.latlng.lat, lng: e.latlng.lng };
      });
    }

    function refreshViews() {
      initCountryFilter();
      initTagFilter();
      renderMarkers();
      renderListView();
    }

    function initCountryFilter() {
      const countrySet = new Set(appData.map(i => i.country).filter(Boolean));
      const countrySelect = document.getElementById("filterCountry");
      countrySelect.innerHTML = `<option value="">全部國家 (${countrySet.size})</option>` + 
        [...countrySet].map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function onCountryChange() {
      const selectedCountry = document.getElementById("filterCountry").value;
      const citySelect = document.getElementById("filterCity");
      const cityDot = document.getElementById("cityDot");

      if (!selectedCountry) {
        citySelect.disabled = true;
        citySelect.className = "w-full mt-1 bg-gray-100 text-gray-400 border border-gray-200 rounded-lg p-2 font-medium outline-none cursor-not-allowed";
        citySelect.innerHTML = `<option value="">請先選擇國家</option>`;
        cityDot.className = "w-2 h-2 rounded-full bg-gray-300 mr-1.5";
      } else {
        citySelect.disabled = false;
        citySelect.className = "w-full mt-1 bg-gray-50 text-gray-800 border border-gray-200 rounded-lg p-2 font-medium focus:border-theme outline-none";
        cityDot.className = "w-2 h-2 rounded-full bg-theme mr-1.5";

        const citiesInCountry = new Set(
          appData.filter(i => i.country === selectedCountry).map(i => i.city).filter(Boolean)
        );

    // 搜尋
    let searchTimeout = null;
    function handleSearch(val) {
      clearTimeout(searchTimeout);
      const card = document.getElementById("searchResultsCard");
      const clearBtn = document.getElementById("clearSearchBtn");

      if (!val.trim()) {
        card.classList.add("hidden");
        clearBtn.classList.add("hidden");
        return;
      }

      clearBtn.classList.remove("hidden");
      const localMatches = appData.filter(s => s.name.includes(val) || (s.address && s.address.includes(val)));

      searchTimeout = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=5`)
          .then(res => res.json())
          .then(results => {
            let html = "";
            if (localMatches.length > 0) {
              html += `<div class="text-[10px] font-bold text-theme-dark px-2 py-0.5">我的日記已記錄：</div>`;
              localMatches.forEach(item => {
                html += `
                  <div onclick="quickFlyTo('${item.name}', ${item.lat}, ${item.lng})" class="flex items-center justify-between p-2 hover:bg-purple-50/50 rounded-xl cursor-pointer">
                    <div>
                      <h4 class="font-bold text-gray-800 text-xs">${item.name}</h4>
                      <p class="text-[10px] text-gray-400 truncate">${item.address || ''}</p>
                    </div>
                    <span class="text-[10px] bg-theme-light text-theme-dark px-2 py-0.5 rounded-full font-bold">已記</span>
                  </div>
                `;
              });
            }

            if (results && results.length > 0) {
              html += `<div class="text-[10px] font-bold text-gray-400 px-2 py-0.5 mt-1">地圖新地點搜尋：</div>`;
              results.forEach(place => {
                const parts = place.display_name.split(',');
                const title = parts[0];
                const cleanAddress = parts.slice(1, 4).join(',');
                html += `
                  <div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-xl">
                    <div class="pr-2 truncate">
                      <h4 class="font-bold text-gray-800 text-xs truncate">${title}</h4>
                      <p class="text-[10px] text-gray-400 truncate">${cleanAddress}</p>
                    </div>
                    <button onclick="selectAndAddPlace('${title.replace(/'/g, "\\'")}', '${cleanAddress.replace(/'/g, "\\'")}', ${place.lat}, ${place.lon})" class="bg-theme text-white text-[11px] font-bold px-2.5 py-1 rounded-xl shadow-xs whitespace-nowrap active:scale-95">
                      記這家
                    </button>
                  </div>
                `;
              });
            }

            if (!html) html = `<div class="p-3 text-center text-xs text-gray-400">查無地標，可點右上角直接手動新增</div>`;
            card.innerHTML = html;
            card.classList.remove("hidden");
          })
          .catch(() => {});
      }, 400);
    }

    // 評分星星
    function buildStarsUI() {
      const container = document.getElementById("starContainer");
      container.innerHTML = "";
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement("span");
        star.className = "inline-block transition active:scale-125";
        star.onclick = (e) => handleStarClick(e, i);
        star.id = `star_${i}`;
        container.appendChild(star);
      }
      updateStarsDisplay(currentRatingValue);
    }

    function handleStarClick(e, starIndex) {
      const rect = e.currentTarget.getBoundingClientRect();
      const isLeft = (e.clientX - rect.left) < (rect.width / 2);
      let val = isLeft ? (starIndex - 0.5) : starIndex;
      if (val < 1.0) val = 1.0;
      setRating(val);
    }

    function handleNumberInput(val) {
      let num = parseFloat(val);
      if (isNaN(num)) return;
      if (num > 5.0) num = 5.0;
      if (num < 1.0) num = 1.0;
      num = Math.round(num * 2) / 2;
      setRating(num, false);
    }

    function setRating(val, updateInputBox = true) {
      currentRatingValue = val;
      if (updateInputBox) document.getElementById("inputRatingNumber").value = val.toFixed(1);
      document.getElementById("starScoreLabel").innerText = `${val.toFixed(1)} 分`;
      updateStarsDisplay(val);
    }

    function updateStarsDisplay(score) {
      for (let i = 1; i <= 5; i++) {
        const star = document.getElementById(`star_${i}`);
        if (!star) continue;
        if (score >= i) star.innerHTML = '<i class="fa-solid fa-star text-amber-400"></i>';
        else if (score >= i - 0.5) star.innerHTML = '<i class="fa-solid fa-star-half-stroke text-amber-400"></i>';
        else star.innerHTML = '<i class="fa-regular fa-star text-gray-300"></i>';
      }
    }

    // 照片
    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement("canvas");
          let w = img.width, h = img.height;
          const maxDim = 900;
          if (w > maxDim) {
            h = Math.round((maxDim / w) * h);
            w = maxDim;
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          uploadedPhotoBase64 = canvas.toDataURL("image/jpeg", 0.75);

          document.getElementById("previewImg").src = uploadedPhotoBase64;
          document.getElementById("uploadBox").classList.add("hidden");
          document.getElementById("photoPreviewArea").classList.remove("hidden");
        };
      };
      reader.readAsDataURL(file);
    }

    function openEditModal(storeId, visitId) {
      const store = appData.find(s => s.id === storeId);
      if (!store) return;
      const visitIndex = store.visits.findIndex(v => v.visitId === visitId);
      const visit = store.visits[visitIndex] || store.visits[0];
      if (!visit) return;

      currentModalMode = 'EDIT';
      editingStoreId = storeId;
      editingVisitId = visit.visitId;

      const actualVisitNum = store.visits.length - visitIndex;
      const visitLabel = actualVisitNum === 1 ? "初訪筆記" : `第 ${actualVisitNum} 次拜訪筆記`;

      document.getElementById("modalMainTitle").innerText = `編輯${visitLabel} ✏️`;
      document.getElementById("inputStoreName").value = store.name;
      document.getElementById("inputCountry").value = store.country || "";
      document.getElementById("inputCity").value = store.city || "";
      document.getElementById("inputStoreAddress").value = store.address || "";
      document.getElementById("inputTags").value = (store.tags || []).join(', ');
      document.getElementById("inputDate").value = visit.date;
      document.getElementById("inputCost").value = visit.cost || "";
      document.getElementById("inputReview").value = visit.review || "";
      document.getElementById("inputRevisit").checked = !!visit.revisit;
      document.getElementById("submitBtnText").innerText = `確認儲存修改 (${visitLabel})`;

      document.getElementById("modalDeleteBtn").classList.remove("hidden");

      setRating(visit.rating);

      if (visit.photo) {
        uploadedPhotoBase64 = visit.photo;
        document.getElementById("previewImg").src = visit.photo;
        document.getElementById("uploadBox").classList.add("hidden");
        document.getElementById("photoPreviewArea").classList.remove("hidden");
      } else {
        removeSelectedPhoto();
      }

      document.getElementById("entryModal").classList.remove("hidden");
    }

    async function confirmSaveRecord() {
      const name = document.getElementById("inputStoreName").value.trim();
      const country = document.getElementById("inputCountry").value.trim() || "台灣";
      const city = document.getElementById("inputCity").value.trim() || "其他";
      const address = document.getElementById("inputStoreAddress").value.trim();
      const date = document.getElementById("inputDate").value;
      const cost = document.getElementById("inputCost").value;
      const review = document.getElementById("inputReview").value;
      const revisit = document.getElementById("inputRevisit").checked;
      const tags = document.getElementById("inputTags").value.split(/[,，\s]+/).filter(Boolean);

      if (!name) return alert("請輸入店家名稱！");

      if (currentModalMode === 'EDIT') {
        const store = appData.find(s => s.id === editingStoreId);
        if (store) {
          store.name = name;
          store.country = country;
          store.city = city;
          store.address = address;
          store.tags = tags;
          const visit = store.visits.find(v => v.visitId === editingVisitId);
          if (visit) {
            visit.date = date;
            visit.rating = currentRatingValue;
            visit.cost = cost ? Number(cost) : null;
            visit.review = review;
            visit.revisit = revisit;
            if (uploadedPhotoBase64) visit.photo = uploadedPhotoBase64;
          }
          await dbPut(store);
        }
      } else if (currentModalMode === 'REVISIT') {
        const store = appData.find(s => s.id === editingStoreId);
        if (store) {
          store.visits.unshift({
            visitId: "v_" + Date.now(),
            date: date,
            rating: currentRatingValue,
            cost: cost ? Number(cost) : null,
            revisit: revisit,
            review: review,
            photo: uploadedPhotoBase64
          });
          store.tags = Array.from(new Set([...store.tags, ...tags]));
          await dbPut(store);
        }
      } else {
        const newStore = {
          id: "store_" + Date.now(),
          name: name,
          country: country,
          city: city,
          address: address,
          lat: pendingLocation?.lat || (25.045 + (Math.random()-0.5)*0.03),
          lng: pendingLocation?.lng || (121.54 + (Math.random()-0.5)*0.03),
          tags: tags.length ? tags : ["美食"],
          visits: [{
            visitId: "v_" + Date.now(),
            date: date,
            rating: currentRatingValue,
            cost: cost ? Number(cost) : null,
            revisit: revisit,
            review: review,
            photo: uploadedPhotoBase64
          }]
        };
        await dbPut(newStore);
        appData.unshift(newStore);
      }

      closeModal();
      clearSearch();
      refreshViews();
    }

    async function deleteRestaurant(id) {
      const store = appData.find(s => s.id === id);
      const name = store ? `「${store.name}」` : "這家餐廳";
      if (confirm(`確定要徹底刪除 ${name} 及其所有拜訪紀錄嗎？此動作無法復原。`)) {
        await dbDelete(id);
        appData = appData.filter(i => i.id !== id);
        refreshViews();
        alert("已成功刪除該店家與所有紀錄！");
      }
    }

    async function deleteSingleVisit(storeId, visitId) {
      const store = appData.find(s => s.id === storeId);
      if (!store) return;

      if (store.visits.length <= 1) {
        if (confirm(`這是「${store.name}」唯一的紀錄，刪除後將會一併移除該店家。確定要刪除嗎？`)) {
          await deleteRestaurant(storeId);
        }
        return;
      }

      if (confirm("確定要刪除這一次的拜訪筆記嗎？其他次拜訪將會保留。")) {
        store.visits = store.visits.filter(v => v.visitId !== visitId);
        await dbPut(store);
        refreshViews();
        alert("已成功刪除該次拜訪筆記！");
      }
    }

    async function deleteCurrentEditingVisit() {
      if (!editingStoreId || !editingVisitId) return;
      closeModal();
      await deleteSingleVisit(editingStoreId, editingVisitId);

    function renderListView() {
      const countryFilter = document.getElementById("filterCountry").value;
      const cityFilter = document.getElementById("filterCity").value;
      const tagFilter = document.getElementById("filterTag").value;
      const ratingFilter = document.getElementById("filterRating").value;
      const sortOrder = document.getElementById("sortOrder").value;

      let list = [...appData];

      if (countryFilter) list = list.filter(i => i.country === countryFilter);
      if (cityFilter) list = list.filter(i => i.city === cityFilter);
      if (tagFilter) list = list.filter(i => (i.tags || []).includes(tagFilter));

      if (ratingFilter === "gte_4.5") list = list.filter(i => i.visits[0]?.rating >= 4.5);
      else if (ratingFilter === "gte_4.0") list = list.filter(i => i.visits[0]?.rating >= 4.0);
      else if (ratingFilter === "gte_3.0") list = list.filter(i => i.visits[0]?.rating >= 3.0);
      else if (ratingFilter === "lt_3.0") list = list.filter(i => i.visits[0]?.rating < 3.0);

      list.sort((a, b) => {
        const ra = a.visits[0]?.rating || 0;
        const rb = b.visits[0]?.rating || 0;
        const da = a.visits[0]?.date || "";
        const db = b.visits[0]?.date || "";

        if (sortOrder === "rating_desc") return rb - ra;
        if (sortOrder === "rating_asc") return ra - rb;
        if (sortOrder === "visits_desc") return b.visits.length - a.visits.length;
        if (sortOrder === "date_desc") return new Date(db) - new Date(da);
        return 0;
      });

      document.getElementById("totalCount").innerText = list.length;
      const container = document.getElementById("restaurantCards");

      if (!list.length) {
        container.innerHTML = `<div class="text-center text-gray-400 py-12 text-xs">查無符合條件的美食日記</div>`;

            <div class="bg-gray-50 p-3 rounded-xl border border-gray-200/80 space-y-2">
              <div class="flex justify-between items-center text-xs border-b border-gray-200/60 pb-1.5">

                    <i class="fa-solid fa-pen mr-1 text-[10px]"></i> 編輯
                  </button>
                  <button onclick="deleteSingleVisit('${item.id}', '${latest.visitId}')" title="刪除本次紀錄" class="text-gray-400 hover:text-red-500 p-1 text-xs">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </div>
              </div>

              <p class="text-xs text-gray-600 leading-relaxed font-medium">"${latest.review || '無心得'}"</p>
            </div>

            <!-- 歷史紀錄回顧 -->
            ${isMulti ? `
              <details class="text-xs text-gray-600 bg-purple-50/40 border border-purple-100 rounded-xl p-2.5">
                <summary class="font-bold text-theme-dark cursor-pointer select-none">
                  📜 查看過往全部 ${item.visits.length} 次拜訪歷史回顧
                </summary>
                <div class="mt-2 space-y-2 pt-2 border-t border-purple-100">
                  ${item.visits.map((v, idx) => {
                    const visitNum = item.visits.length - idx;
                    const isLatest = idx === 0;
                    return `
                      <div class="bg-white p-2.5 rounded-xl border border-purple-100/70 space-y-1.5">
                        <div class="flex justify-between items-center text-[11px] border-b border-gray-100 pb-1">
                          <div class="flex items-center space-x-1.5">
                            <span class="font-bold text-gray-800">${visitNum === 1 ? '初訪' : `第 ${visitNum} 次`} (${v.date})</span>
                            <span class="font-bold text-amber-500">★ ${v.rating.toFixed(1)}</span>
                            ${isLatest ? '<span class="bg-purple-100 text-theme-dark text-[9px] px-1.5 py-0.2 rounded font-bold">最新</span>' : ''}
                          </div>
                          
                          <div class="flex items-center space-x-1.5">
                            <button onclick="openEditModal('${item.id}', '${v.visitId}')" class="text-gray-500 hover:text-theme bg-gray-50 hover:bg-purple-50 border border-gray-200 px-2 py-0.5 rounded-md text-[10px] font-bold transition flex items-center active:scale-95">
                              <i class="fa-solid fa-pen mr-1 text-[9px]"></i> 編輯
                            </button>
                            <button onclick="deleteSingleVisit('${item.id}', '${v.visitId}')" title="刪除本次紀錄" class="text-gray-400 hover:text-red-500 p-0.5 text-xs">
                              <i class="fa-solid fa-trash-can"></i>
                            </button>
                          </div>
                        </div>
                        <p class="text-[11px] text-gray-600 leading-relaxed">${v.review || ''}</p>
                      </div>
                    `;
                  }).join('')}
                </div>
              </details>
            ` : ''}

            <div class="flex flex-wrap gap-1">
              ${(item.tags || []).map(t => `<span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-full font-medium">#${t}</span>`).join('')}
            </div>

            <!-- 卡片底部動作 -->
            <div class="flex justify-between items-center text-[11px] text-gray-400 pt-1 border-t border-gray-150">
              <div class="flex items-center space-x-3">
                <span>均消 ${latest.cost ? `$${latest.cost}` : '未記'}</span>
                <button onclick="deleteRestaurant('${item.id}')" class="text-gray-400 hover:text-red-500 flex items-center space-x-1 text-xs">
                  <i class="fa-solid fa-trash-can"></i>
                  <span>刪除店家</span>
                </button>
              </div>
              <button onclick="openRevisitModal('${item.id}')" class="bg-theme-light hover:bg-theme text-theme-dark hover:text-white px-3 py-1 rounded-full font-bold transition flex items-center active:scale-95 shadow-xs">
                <i class="fa-solid fa-pen-nib mr-1"></i> ＋ 寫新一次再訪
              </button>
            </div>
          </div>
        `;
      }).join('');
    }

    function switchTab(tab) {
      const mapView = document.getElementById("mapView");
      const listView = document.getElementById("listView");
      const tabMapBtn = document.getElementById("tabMapBtn");
      const tabListBtn = document.getElementById("tabListBtn");

      if (tab === 'map') {
        mapView.classList.remove("hidden");
        listView.classList.add("hidden");
        tabMapBtn.className = "flex flex-col items-center text-theme font-bold text-xs";
        tabListBtn.className = "flex flex-col items-center text-gray-400 font-bold text-xs";
        setTimeout(() => map.invalidateSize(), 150);
      } else {
        mapView.classList.add("hidden");
        listView.classList.remove("hidden");
        tabListBtn.className = "flex flex-col items-center text-theme font-bold text-xs";
        tabMapBtn.className = "flex flex-col items-center text-gray-400 font-bold text-xs";
        renderListView();
      }
    }

    function locateUser() {
      if (!navigator.geolocation) return alert("您的裝置不支援 GPS 定位");
      const btn = document.querySelector('button[title="定位我的位置"]');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-theme"></i>';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          btn.innerHTML = '<i class="fa-solid fa-crosshairs text-theme text-lg"></i>';
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (userLocationMarker) map.removeLayer(userLocationMarker);
          userLocationMarker = L.circleMarker([lat, lng], {
            radius: 8, fillColor: "#9C95DB", color: "#FFFFFF", weight: 3, opacity: 1, fillOpacity: 0.95
          }).addTo(map).bindPopup("📍 您的目前位置").openPopup();
          map.flyTo([lat, lng], 15, { duration: 1.5 });
        },
        () => {
          btn.innerHTML = '<i class="fa-solid fa-crosshairs text-lg"></i>';
          alert("定位失敗，請確認已開啟定位權限！");
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function toggleBackupMenu() {
      document.getElementById("backupMenu").classList.toggle("hidden");
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `我的美食日記備份_${new Date().toISOString().split("T")[0]}.json`;
      a.click();
      toggleBackupMenu();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const list = JSON.parse(e.target.result);
          if (Array.isArray(list)) {
            for (const item of list) {
              await dbPut(item);
            }
            appData = await dbGetAll();
            refreshViews();
            alert(`✅ 還原成功！已匯入 ${list.length} 間餐廳紀錄。`);
          }
        } catch {
          alert("匯入失敗，請確認檔案格式是否正確。");
        }
      };
      reader.readAsText(file);
      toggleBackupMenu();
    }

    window.onload = initApp;
  </script>
</body>
</html>
